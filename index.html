/* Edition 2: masterclass clinical evidence interface and WCAG keyboard refinements. */
.skip-nav{position:fixed;top:-70px;left:18px;z-index:300;background:var(--accent);color:var(--accentInk);padding:12px 18px;border-radius:8px;font-weight:750}
.skip-nav:focus{top:12px}
*:focus-visible{outline:3px solid var(--accent2)!important;outline-offset:3px}
.challenge-box{border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:20px;margin:22px 0}
.challenge-box h3{margin:0 0 8px}.challenge-options{display:grid;gap:9px;margin-top:14px}
.challenge-options button{text-align:left;border:1px solid var(--line);color:var(--ink);background:var(--surface);padding:12px;border-radius:9px;font:inherit;cursor:pointer}
.challenge-options button.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.challenge-options button.good{border-color:var(--success)}.challenge-options button.bad{border-color:var(--danger)}
.lesson-lab{border-left:4px solid var(--accent2);background:var(--surface2);border-radius:12px;padding:20px;margin:20px 0}
.lab-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}
.lab-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.lab-steps>div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.status-text{font-weight:700;margin:10px 0}.status-text.ok{color:var(--success)}.status-text.error{color:var(--danger)}
.pre-wrap{white-space:pre-wrap;overflow-wrap:anywhere}.source-note{font-size:12px;color:var(--subtle)}
.compact-code{max-height:440px;overflow:auto}.quiz-item{scroll-margin-top:80px}
.exercise-evidence{display:grid;gap:10px}.exercise-evidence textarea{min-height:120px}
.diagnostic{margin-top:25px}.standalone-lab-notice{border:1px solid var(--accent2);background:var(--surface2);border-radius:14px;padding:20px}
.study-progress{display:inline-flex;gap:9px;align-items:center;flex-wrap:wrap}
@media(max-width:530px){.lab-steps{grid-template-columns:1fr}.challenge-box,.lesson-lab{padding:14px}.challenge-options button{min-height:44px}}

<script>
'use strict';
const COURSE = [{"name":"Agentic AI Fundamentals","track":"Foundation","hours":5,"summary":"Understand the bounded control loop that transforms probabilistic model outputs into controlled, auditable actions.","prerequisites":["Python and JSON basics","HTTP request/response model"],"objectives":["Distinguish a model, workflow and autonomous agent","Implement a budgeted tool-use state machine","Define autonomy boundaries and measurable termination criteria"],"lessons":[{"title":"Models, agents and authority","concept":"A language model predicts responses conditioned on instructions and context. An agent is an application that wraps a model in state, tools, goals and a control loop; the application—not the model—owns permissions and side effects. A workflow hard-codes transitions, while an agent may choose its next allowable step. Autonomy is therefore a continuum of bounded decisions, not an unrestricted capability.","internals":"In a request, the controller authenticates the principal, assembles a context envelope, invokes the model, parses a proposed action, validates it and either executes a tool or returns an answer. Tool results are new untrusted observations. A model-generated intention must never be treated as an authorization token.","build":"Define an input contract with request_id, tenant_id, principal, goal, deadline and budget. List possible tool permissions separately. Start with a deterministic workflow; add model-selected branching only where uncertainty delivers measurable value.","tradeoff":"Workflows provide deterministic test surfaces and simpler auditing. Agents adapt to irregular tasks, but introduce nondeterministic branching, token expense and additional security checks.","failure":"An unconstrained model repeatedly calls the same tool. Detect repeated equivalent actions, stop after max_steps, surface partial completion and log the termination reason.","field_note":"Worked example: a customer requests an address update. The model can propose read_customer, explain_missing_fields or update_customer; only the first two are initially enabled. The user identity is authenticated at the API, not parsed from the message. A proposed write creates an immutable action intent and WAITING_APPROVAL status. Before approval, the database row count for customer updates must remain unchanged. Once an independent reviewer authorizes the exact record version, execution uses the same action ID and produces an audit event. The success contract checks both the changed address and the authorized decision record."},{"title":"The bounded reasoning-and-action loop","concept":"The controller follows observe → plan → act → verify until success, explicit denial, expiration, or an iteration/cost ceiling. ReAct is a useful conceptual pattern for alternating actions and observations, but free-form hidden reasoning is not a durable workflow record.","internals":"Treat the model response as data: a typed final result, a structured tool call, or a recoverable validation failure. Use a per-turn budget and an overall workflow budget. Record normalized events rather than relying on prose transcripts to reconstruct execution.","build":"Build a state machine with RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED and CANCELED states. Attach a monotonically increasing version to transitions. Provide deterministic fallback and a dead-letter route for unresolved runs.","tradeoff":"Allowing longer trajectories sometimes improves hard tasks, but marginal gains saturate while latency, drift and tool risk rise. Set limits using offline evaluation rather than intuition.","failure":"A malformed tool argument should not fall through to unrestricted execution. Return a structured validation error and allow at most a bounded repair attempt.","field_note":"Execution trace: start with a four-step run budget and a 60-second deadline. At step one, the model proposes read_account; the adapter returns data. At step two it proposes read_account with an identical canonical argument hash. Rather than allowing unbounded cycles, the controller records repeated_action=true and either prompts for a different evidence strategy once or stops. Reserve output tokens before the next call so the model cannot exhaust the budget before returning a structured result. Test an invalid action name, missing schema property and tool timeout; each should reach an explicit terminal or retry state."},{"title":"Designing goals, contracts and success metrics","concept":"Success is not merely a fluent answer. Define factual accuracy, tool correctness, authorized impact, completion latency, spend and the rate of human interventions. Use typed acceptance criteria such as evidence citations or status transitions.","internals":"Create a minimal golden dataset with normal, ambiguous, adversarial and unavailable-tool cases. Store expected invariant checks alongside human judgment rubrics. A realistic agent evaluates source freshness and confidence before crossing a side-effect boundary.","build":"Choose one narrow workflow, identify action owners and annotate each action by reversible vs irreversible and read vs write. Specify SLOs and what the agent must do when evidence is insufficient.","tradeoff":"Strict contracts may require clarification or abstention more often, but reduce silent business errors. Prefer explicitly incomplete work to unauthorized apparent success.","failure":"High apparent answer quality masks missing citations and accidental writes. Require separate assertions for output quality, side-effect records and policy compliance.","field_note":"Acceptance harness: build 40 tasks spanning common queries, missing information, conflicting source data, tool unavailability and adversarial text. Evaluate task_success, policy_violations, steps_per_completion, retry amplification and p95 latency separately. A fluent final answer earns no success credit if the tool action did not occur. If the authoritative account balance is unavailable, the expected result is insufficient_evidence rather than a fabricated number. Change one prompt/model version at a time and compare per-cohort outcomes against a frozen evaluation set. Hard-fail the release on any unauthorized write, even if aggregate quality improves."}],"design":"Default to a deterministic shell around probabilistic steps: authorization and state transitions are code-owned; language generation is model-owned.","security":"Bound recursion, enforce tool allowlists and authenticate each request independently of model content.","runbook":"Investigate looping: compare normalized action hashes, remaining token budget and step counter; quarantine repeated patterns and inspect trajectory traces.","exercise":"Implement a deterministic simulated three-step agent with max_steps=4, two read tools and one write tool requiring approval. Test a missing tool and repeated-call loop.","expected":"Pass: the read request completes, a proposed write pauses for approval, and loops end with a machine-readable failure rather than hanging.","reference":"Production principle: the LLM proposes; the runtime validates and executes.","py":"from dataclasses import dataclass\n\n@dataclass\nclass Budget:\n    remaining: int = 4  # Maximum model/tool decision steps.\n\ndef run_agent(model, tools, goal: str, budget: Budget):\n    history = [{\"role\": \"user\", \"content\": goal}]  # Scoped run state.\n    while budget.remaining > 0:  # Enforce a hard stopping condition.\n        budget.remaining -= 1  # Count each decision, even failed ones.\n        reply = model.decide(history)  # Proposed output, NOT authority.\n        if reply[\"type\"] == \"final\":  # Typed terminal transition.\n            return {\"status\": \"succeeded\", \"output\": reply[\"text\"]}\n        name, args = reply[\"name\"], reply[\"args\"]  # Tool proposal.\n        if name not in tools:  # Enforce runtime allowlist.\n            return {\"status\": \"denied\", \"reason\": \"unknown_tool\"}\n        result = tools[name](**args)  # Tools validate identity and schema.\n        history.append({\"role\": \"tool\", \"content\": str(result)})\n    return {\"status\": \"failed\", \"reason\": \"step_budget_exhausted\"}","config":"# Example policy, not a live deployment configuration.\nrun:\n  max_steps: 4\n  deadline_seconds: 60\n  max_output_tokens: 1200\nactions:\n  read_customer: allow\n  update_customer: require_human_approval\n  run_shell: deny","quiz":[{"q":"Which component should decide whether a tool call is authorized?","choices":["Retrieved document","Application runtime policy","Tool description prose","Model instructions"],"answer":1,"why":"Authorization must be enforced by trusted runtime code, not untrusted model output."},{"q":"What is a necessary condition for bounded agency?","choices":["A stable system prompt","Unlimited retries","Termination and budget constraints","A larger context window"],"answer":2,"why":"Bounded steps, time and cost prevent unending runs and control blast radius."},{"q":"Which statement best distinguishes agents and workflows?","choices":["Only agents can call APIs","Workflows cannot use language models","Agents need no state","Workflows have explicit transitions; agents can select bounded next actions"],"answer":3,"why":"An agent may decide a permitted next step; workflows use predetermined control flow."},{"q":"A planning model returns an unrecognized command while the remaining step budget is one. What should the runtime do?","choices":["Execute it if the model is confident","Ask the model to ignore the unknown command","Reject the command in a trusted dispatcher and terminate with an explicit error","Grant temporary admin tool scope"],"answer":2,"why":"Reject the command in a trusted dispatcher and terminate with an explicit error. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: A planning model returns an unrecognized command while the remaining step budget is one. Which next action is operationally defensible?","choices":["Execute it if the model is confident","Grant temporary admin tool scope","Reject the command in a trusted dispatcher and terminate with an explicit error","Ask the model to ignore the unknown command"],"answer":2,"why":"Reject the command in a trusted dispatcher and terminate with an explicit error; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Client","detail":"Authenticated request and tenant context"},{"name":"Controller","detail":"Owns state, budgets and termination"},{"name":"LLM","detail":"Suggests structured action or final answer"},{"name":"Policy gate","detail":"Validates schema, identity and allowed capability"},{"name":"Tool","detail":"Performs bounded side effect and returns an observation"},{"name":"Evidence","detail":"Verified result with provenance"}],"simulation":"lifecycle"},{"name":"Core Infrastructure Architecture","track":"Foundation","hours":6,"summary":"Map agent services onto compute, durable state, storage, queues, networks and model boundaries.","prerequisites":["Module 1","Basic networking and database concepts"],"objectives":["Draw an end-to-end topology and trust boundaries","Select storage, queue and compute roles","Design tenant-aware request propagation"],"lessons":[{"title":"The control plane and data plane","concept":"Separate the control plane (policies, agent definitions, rollout, registry) from the data plane (live task executions, tool calls and retrieval). The API edge terminates authentication; an orchestration service records run metadata; stateless workers execute steps; durable systems retain state.","internals":"Typical write path: edge → authorization → orchestration database → queue → worker → model gateway/tool adapter → event store. Retrieval follows a tenant-filtered index, usually backed by object storage and a metadata store. Correlate every operation with run_id, tenant_id and trace_id.","build":"Draw availability zones, outbound egress paths, data residency and secret access. Assign each component an owner and state whether the component can be rebuilt from durable records.","tradeoff":"Putting every component in a single service simplifies a prototype but couples scaling, retries and permissions. Extract a queue/worker boundary once execution exceeds request timeouts.","failure":"If a worker dies after an external write but before acknowledging a queue message, redelivery can duplicate effects. Design idempotent adapters and a persistent execution ledger.","field_note":"Topology sizing: for 10,000 requests per day, the daily average is roughly 0.116 requests/second, but production capacity must use observed peak-to-average ratio and execution duration. If bursts reach 8 requests/second and average execution lasts 20 seconds, Little's Law suggests about 160 concurrent runs before headroom. Request servers can remain stateless; workers and model quotas determine actual useful concurrency. Give each request a tenant ID, a durable run ID and a received timestamp. Maintain a private-only database path and a separately filtered outbound API path. Record which components need multi-zone redundancy."},{"title":"Databases, queues and consistency","concept":"Use relational storage for authoritative run records, events and approval decisions; object storage for source files and large artifacts; a vector index for semantic candidate retrieval; a durable queue for asynchronous work. A cache is expendable acceleration, not the source of truth.","internals":"At-least-once delivery is common; exactly-once end-to-end effects generally require application-level idempotency and transactional coordination. Store message_id and action_id. Use an outbox to atomically write business state plus an event intent, then publish asynchronously.","build":"Sketch tables for runs, steps, approvals, idempotency_keys and outbox. Specify unique constraints, TTL policies, encryption and tenant composite keys.","tradeoff":"Eventual consistency supports throughput but may briefly expose stale search results. Strict transactional checks belong at the authoritative datastore.","failure":"Queue growth with healthy workers can indicate upstream amplification or stuck downstream dependencies; measure age of oldest message, not just count.","field_note":"Transactional outbox drill: create a run and outbox row in one SQL transaction. If the process crashes before commit, neither should exist; if it crashes after commit but before publish, the outbox publisher sends the event on restart. A consumer may receive the event twice after acknowledgement loss. Its action_id must be stable and the external system must enforce idempotency or support reconciliation. A local 'already processed' lookup alone is not sufficient because concurrent deliveries can race. Use a unique action ledger, a locking/claim strategy and provider-level idempotency when available."},{"title":"Networking, identity and failure domains","concept":"Private subnets, service identity, network policies and outbound proxies constrain agent reach. Use mTLS or workload identity for service-to-service authentication and explicit egress allowlists for external MCP/API targets.","internals":"Request correlation flows through headers and task payloads; sensitive credentials do not. Place model gateways behind controlled egress and apply tenant-specific budgets. Define which zones hold PII and avoid replicating sensitive data to unrelated regions.","build":"Create a topology checklist: ingress WAF, API gateway, identity provider, orchestrator, durable SQL, queue, worker fleet, model router, tool proxy, retrieval stores and telemetry sink.","tradeoff":"A managed service reduces undifferentiated operations, but increases vendor dependency. Self-hosting improves locality/control while transferring patching and capacity duties to your team.","failure":"An SSRF attempt arrives as a tool argument containing an internal URL. Reject disallowed destinations at the egress proxy, including DNS rebinding and redirected hosts.","field_note":"Network boundary exercise: assign API, broker, SQL, model gateway and MCP tool proxy to separate service identities. Deny worker egress by default except gateway and required DNS endpoints. Send a model-generated tool argument containing http://169.254.169.254/ and verify the proxy refuses the destination even after HTTP redirection or DNS resolution changes. Log the deny as a security event without echoing sensitive URLs into user-visible transcripts. Test a single-zone worker outage and show queued tasks continue. Then simulate SQL primary failure: accepting writes should stop or follow a documented failover policy, never silently drop accepted jobs."}],"design":"Minimum viable production: API tier + durable SQL + at-least-once queue + workers + controlled model/tool gateways + object store + telemetry.","security":"Enforce tenant-scoped queries, private network boundaries, workload identity, data encryption and deny-by-default outbound network rules.","runbook":"If jobs disappear, reconcile request records with the transactional outbox, broker acknowledgments and worker state; never infer success from HTTP 202.","exercise":"Create a topology for a 10,000-task/day workload with 99.9% availability objective. Label the authoritative store, replay semantics, security edges and recovery dependencies.","expected":"Pass: deleting a worker does not lose queued work; the architecture identifies how duplicated deliveries do not duplicate an external payment.","reference":"Store intended work durably before saying “accepted”; acknowledge queue messages after committed effects.","py":"# A tested, runnable cross-database recovery example.\n# Run inside the downloaded reference kit, not in the browser.\nfrom agent_platform.core import Platform, Principal\nimport tempfile\n\nwith tempfile.TemporaryDirectory() as directory:\n    p = Platform(directory)\n    author = Principal('author', 'acme', frozenset({'writer'}))\n    reviewer = Principal('reviewer', 'acme', frozenset({'reviewer'}))\n    p.resource('acme', 'invoice-42')\n    action_id = p.submit(author, 'invoice-42', {'amount': 25})\n    p.decide(reviewer, action_id, 'APPROVE')\n    try:\n        p.deliver(action_id, crash_after_remote=True)\n    except RuntimeError:\n        pass  # Inject crash AFTER remote commit.\n    assert p.deliver(action_id) == 'done'\n    # Exactly one external effect because the TARGET owns idempotency.\n    assert p.target.execute('SELECT count(*) FROM remote_effects').fetchone()[0] == 1\n    p.close()","config":"# Conceptual K8s NetworkPolicy: restrict outbound traffic.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: agent-worker-egress\nspec:\n  podSelector:\n    matchLabels: {app: agent-worker}\n  policyTypes: [Egress]\n  egress:\n    - to:\n        - namespaceSelector:\n            matchLabels: {name: gateway}\n      ports: [{protocol: TCP, port: 443}]\n# Add DNS and required internal service destinations in real clusters.","quiz":[{"q":"Which store should own the authoritative approval decision?","choices":["Vector index","Browser session","Cache","Transactional database"],"answer":3,"why":"Approval needs durable transactional ownership and auditable versioned state."},{"q":"Why must workers be idempotent?","choices":["Caching always fails","Queues can redeliver messages","SQL is eventually consistent","GPU inference is deterministic"],"answer":1,"why":"Crashes or acknowledgement loss may cause at-least-once redelivery."},{"q":"Which metric best exposes queue starvation?","choices":["Model temperature","Embedding dimensionality","Age of oldest pending message","CSS bundle size"],"answer":2,"why":"Oldest message age reveals stalled work even when average throughput looks healthy."},{"q":"A worker times out just after a third-party accounting system commits a credit. What should the runtime do?","choices":["Delete the local outbox","Query remote state by stable idempotency key and reconcile","Mint a new key and retry immediately","Assume the write failed without checking"],"answer":1,"why":"Query remote state by stable idempotency key and reconcile. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: A worker times out just after a third-party accounting system commits a credit. Which next action is operationally defensible?","choices":["Mint a new key and retry immediately","Query remote state by stable idempotency key and reconcile","Assume the write failed without checking","Delete the local outbox"],"answer":1,"why":"Query remote state by stable idempotency key and reconcile; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Identity edge","detail":"Authentication, request IDs and tenant context"},{"name":"API service","detail":"Idempotent intake; writes authoritative run state"},{"name":"SQL + outbox","detail":"Transactional state and publish intentions"},{"name":"Durable queue","detail":"Decouples admission from execution"},{"name":"Worker fleet","detail":"Executes bounded, repeatable steps"},{"name":"Gateways","detail":"Controlled model inference and tool egress"},{"name":"Telemetry","detail":"Traces, logs and SLO metrics"}],"simulation":"topology"},{"name":"Agent Architecture Patterns","track":"Architecture","hours":6,"summary":"Select reasoning and control-flow patterns according to uncertainty, task duration and blast radius.","prerequisites":["Modules 1–2","Basic finite-state machines"],"objectives":["Compare ReAct, planner-executor and supervisor-worker","Specify transition guards and stopping conditions","Apply reflection without unbounded recursive loops"],"lessons":[{"title":"ReAct and tool-driven controllers","concept":"ReAct alternates decisions and environment observations. The runtime sees only structured observable actions and results; it should not require access to or storage of private model reasoning. It is effective when the next action depends on data returned by the last tool.","internals":"Implement a typed set of permissible actions and run the model one step at a time. Allow only tool schemas issued by the registry. Record action arguments, outputs, statuses and causal IDs. Use explicit done, ask-human and fail transitions.","build":"Test a customer-support case where a read-only API is attempted first, then an update requires approval. Measure steps-to-success, invalid proposals and redundant tool calls.","tradeoff":"Flexible action selection helps under uncertainty, but a fixed DAG has lower latency and simpler regression testing for known processes.","failure":"ReAct loops can thrash between similar calls. Detect repeated normalized calls and trigger a deterministic fallback.","field_note":"Choosing ReAct: incident triage starts with an unknown host identifier. A flexible controller may first query the asset registry, then use the resolved host to fetch its logs, then select a diagnostic check. This sequential dependency is a good ReAct fit. Enforce three restrictions: the logging tool is read-only; queries are capped by time range and result size; and remediation cannot be proposed as an executable command. Record each observation and the tool's schema version. Contrast with scheduled overnight report generation, where a fixed DAG is easier, cheaper and more testable than model-selected actions."},{"title":"Plan-and-execute and reflection","concept":"A planner produces an ordered or partially ordered task graph; executors carry out nodes with typed outputs. Reflection is a bounded evaluation stage that compares the result against a rubric, not a license to keep generating until the model feels satisfied.","internals":"Persist the plan version, task dependencies and evidence references. On changes, recalculate only affected nodes and prevent stale downstream work from committing. A critic may identify missing evidence; it must not be granted broader tool authority than the task controller.","build":"Implement a three-stage pipeline: retrieve evidence, draft answer, validate sources. Permit one revision if validation fails, then escalate or abstain.","tradeoff":"Planner overhead may dominate short tasks; use only when decomposition yields parallelism, better observability or recoverability.","failure":"Stale plans can silently execute against changed facts. Revalidate external state before irreversible execution.","field_note":"Planner worked case: divide a security questionnaire into evidence retrieval, requirement mapping, drafting and validation. Retrieval and mapping have an explicit dependency; two independent business domains can run in parallel. The planner emits JSON task IDs and predecessor IDs, not an unchecked narrative. Each executor returns source references with version timestamps. If the policy document changes after planning, the workflow invalidates downstream outputs that depend on that version, not every completed task. Limit reflection to one revision when sources are missing; a second failure becomes needs_review. This yields predictable upper bounds on inference calls."},{"title":"Hierarchical and event-driven agents","concept":"A supervisor delegates bounded tasks to specialists; an event-driven agent reacts to records or messages, not a constantly running chat loop. Delegation should transfer task inputs, least-privilege access and a return contract, not unconstrained global memory.","internals":"A coordinator assigns child task IDs, deadlines and join conditions. Fan-out tasks require separate idempotency keys and an explicit timeout policy for partial completion. Events have schema versions and causal parent IDs.","build":"Model incident triage using a classifier, log-retrieval specialist and remediation suggester. Only a separate approval service can authorize an actual remediation.","tradeoff":"Central supervisors simplify authority; peer-to-peer agents can improve throughput but complicate causal ordering, audit and conflict resolution.","failure":"If two specialists write the same ticket concurrently, apply optimistic concurrency with record versions and an explicit conflict-resolution policy.","field_note":"Supervisor join analysis: a coordinator sends work to three specialists at t=0. Research returns after 5 seconds, compliance after 13, and risk after 8. The join takes 13 seconds if all are mandatory; total worker time is 26 seconds plus coordination. If compliance times out after 15 seconds, the supervisor must return a typed partial result, not imply compliance approval. Restrict each specialist's tools to its domain and attach a deadline to every child task. Inject a late result after cancellation and verify it cannot change the terminal parent state or trigger a side effect."}],"design":"Select patterns by constraint: ReAct for uncertain sequential discovery, DAG for known dependencies, supervisor for specialization, events for long-lived asynchronous work.","security":"Give each pattern explicit capability bounds. A critic or specialist never receives privilege merely because another agent delegated to it.","runbook":"When outputs conflict, inspect provenance, plan version, stale-read age and each child task outcome; do not just ask another model to guess.","exercise":"Architect an IT incident agent using a supervisor, three specialists, a read-only investigation stage and a gated rollback action.","expected":"Pass: the diagram identifies failure propagation, delegation contracts and a safe partial-results outcome when a specialist times out.","reference":"Use explicit schemas for every delegation edge and include a correlation ID across every child task.","py":"from dataclasses import dataclass\n\n@dataclass\nclass Task:\n    id: str\n    kind: str\n    dependency_ids: tuple[str, ...]  # Must finish before starting.\n\nplan = [\n    Task(\"evidence\", \"retrieve_logs\", ()),\n    Task(\"hypothesis\", \"analyze\", (\"evidence\",)),\n    Task(\"review\", \"validate\", (\"hypothesis\",)),\n]\n\ndef ready(task: Task, completed: set[str]) -> bool:\n    # The scheduler decides eligibility; the model does not.\n    return all(dep in completed for dep in task.dependency_ids)\n\n# Persist completed and running sets to recover after worker restart.","config":"workflow:\n  pattern: supervisor-worker\n  concurrency_limit: 3\n  partial_result_policy: escalate\n  children:\n    - {name: retrieve_logs, scope: read:logs, timeout_s: 15}\n    - {name: analyze, scope: read:evidence, timeout_s: 30}\n    - {name: propose, scope: write:none, timeout_s: 20}\n  irreversible_actions: require_explicit_approval","quiz":[{"q":"When is a fixed DAG generally preferable to a free-form agent loop?","choices":["No outputs can be typed","Every task is novel","Tool capabilities are unknown","Dependencies are known and stable"],"answer":3,"why":"Known task graphs are easier to reason about, evaluate and replay."},{"q":"What is a safe reflection limit?","choices":["Until the critic is satisfied","Unlimited if temperature is zero","A bounded revision count tied to a rubric","One pass per worker CPU"],"answer":2,"why":"Reflection should be an explicit bounded validator, not indefinite self-critique."},{"q":"What must cross a supervisor-worker handoff?","choices":["All other agents’ private state","Every secret in the system","Scoped inputs, permissions and return schema","Administrator database credentials"],"answer":2,"why":"Minimize context and capabilities passed to specialists."},{"q":"A planner delegates a job to two workers and one times out before the deadline. What should the runtime do?","choices":["Wait forever because all workers must complete","Remove the parent trace","Silently invent the child output","Apply the declared partial-join policy and record a failed child"],"answer":3,"why":"Apply the declared partial-join policy and record a failed child. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: A planner delegates a job to two workers and one times out before the deadline. Which next action is operationally defensible?","choices":["Apply the declared partial-join policy and record a failed child","Wait forever because all workers must complete","Silently invent the child output","Remove the parent trace"],"answer":0,"why":"Apply the declared partial-join policy and record a failed child; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Supervisor","detail":"Partitions goals and sets budgets"},{"name":"Planner","detail":"Produces typed dependencies"},{"name":"Investigator","detail":"Read-only evidence gathering"},{"name":"Analyst","detail":"Forms bounded analysis outputs"},{"name":"Validator","detail":"Checks rubric and sources"},{"name":"Join + escalation","detail":"Combines or escalates partial results"}],"simulation":"multi"},{"name":"LLM Infrastructure","track":"Infrastructure","hours":7,"summary":"Operate a model gateway with intelligent routing, budget controls, structured outputs and inference economics.","prerequisites":["Modules 1–3","Basic performance benchmarking"],"objectives":["Compare hosted vs self-hosted inference","Implement token accounting, backpressure and safe cache keys","Route tasks using quality, latency, residency and cost constraints"],"lessons":[{"title":"Model gateway and task-based routing","concept":"A model gateway terminates provider credentials and centralizes routing, rate limits, schemas, circuit breakers and observability. Route by task risk and measured quality rather than raw model size. Different tasks may require different providers, structured-output guarantees or data residency.","internals":"A routing request contains tenant, task_class, policy, context length and deadline. The gateway uses a policy table and healthy-capacity signals to choose a model. Persist the chosen provider, exact model version and fallback reason in trace metadata.","build":"Build a route for classification, retrieval-grounded drafting and high-stakes review. Force high-stakes review to a validated model tier; log when capacity makes the requested tier unavailable.","tradeoff":"Self-hosting can improve residency and sustained-volume unit cost but needs GPUs, inference scaling, batching and operational expertise. Hosted APIs shift that burden but add vendor and egress dependencies.","failure":"Fallback across providers can change quality and privacy contracts. Never fail open to a provider outside the tenant residency or retention policy.","field_note":"Gateway routing exercise: a low-risk routing classifier processes 80% of requests on a fast tier; 20% require a higher-quality tier. Track each cohort's pass rate and cost separately. If the higher-quality tier is unavailable, fallback is permitted only when the alternate provider satisfies data residency and test thresholds. Include the policy version, selected model version, requested region, actual provider and reason for fallback in every trace. Model names and price schedules change rapidly, so do not hard-code assumptions into domain business logic. Build a shadow benchmark before changing the route policy."},{"title":"Inference throughput and optimization","concept":"Latency includes queueing, prompt ingestion/time-to-first-token and decoding. Throughput depends on batching, KV-cache memory, model parallelism and output length. Prefix caching works only for an identical authorized prefix; semantic response caching can introduce staleness or cross-tenant leakage.","internals":"Track prompt tokens, generated tokens, cached tokens, batch size, tokens/sec and percentiles. Compute the capacity envelope from benchmarked representative prompt/output distributions rather than a single synthetic short prompt.","build":"Benchmark at several concurrency levels; record p50/p95 and error rate. Configure context caps and stop tokens. For self-hosted deployments, test memory pressure under worst-case simultaneous context lengths.","tradeoff":"Aggressive batching improves GPU utilization but can worsen latency for interactive workloads. Use separate queues/classes for latency-sensitive and bulk jobs.","failure":"Long outputs consume decode capacity and budget. Enforce output-token limits; avoid relying on natural-language instructions to shorten results.","field_note":"Latency budgeting: suppose median ingress/auth is 60 ms, retrieval 200 ms, model prompt processing 500 ms, decoding 1,600 ms and tool call 700 ms. Sequential latency is approximately 3.06 seconds before queue delay. Adding another model revision step can materially raise tail latency. Time-to-first-token and decode tokens must be measured separately; a 4,000-token response has a different throughput profile from a short classification result. On GPUs, test concurrency and prompt length together because KV-cache pressure depends on active sequences and context length. Batch only where the interactive p95 SLO permits it."},{"title":"Typed outputs and reliability contracts","concept":"Structured model output is an input to runtime validation, not proof of correctness. JSON Schema or language validators enforce shape, enums, bounds and allowed fields. Semantic checks verify cross-field invariants against authoritative data.","internals":"Prefer a parser that rejects unexpected fields. On transient malformed output, optionally issue one schema-focused retry; on policy violations, stop or escalate rather than asking the model to override the rule.","build":"Create a decision payload {action, resource_id, reason, evidence_ids}. Validate evidence IDs against a retrieval index and ensure action belongs to the granted scope.","tradeoff":"Constrained decoding reduces syntactic failures but cannot guarantee business logic, truthfulness or access control.","failure":"Retries for 429 or 503 must honor deadlines, jitter and Retry-After. Avoid retry storms and account for per-provider saturation.","field_note":"Token bill walkthrough: 250,000 monthly runs × 3,000 input tokens equals 750 million input tokens. At 35% cache eligibility, 487.5 million are uncached and 262.5 million cached; 700 output tokens per run produce 175 million output tokens. Multiply each bucket by its corresponding per-million rate and then add retries, embedding, workers and storage. If a prompt change cuts input by 20% but reduces grounded-answer accuracy by two percentage points, use cost per correct task to decide rather than assuming shorter is better. Profile token distributions at p50/p95, not only their averages."}],"design":"Place routing and provider keys behind a central gateway with policy-aware fallback and observability; evaluate candidate routes on representative tasks.","security":"Pin allowed model/provider regions, strip secrets from prompts, segregate cache namespaces and hard-bound tokens and tool exposure.","runbook":"For p95 latency spikes, break down queue, TTFT and decode; correlate token distributions, batch length, active requests and provider 429s.","exercise":"Estimate monthly inference cost for 250,000 runs at 3,000 input and 700 output tokens, then model a 40% prefix-cache hit and 20% shorter responses.","expected":"Pass: the budget model distinguishes input/output/cached rates, concurrency and caching scope; it reports assumptions and sensitivity.","reference":"Model pricing is variable; calculate from explicitly entered rates rather than hard-coded vendor promises.","py":"from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Route:\n    model: str\n    region: str\n    max_output_tokens: int\n\nROUTES = {\n    \"classify\": Route(\"fast-tier\", \"us\", 200),\n    \"research\": Route(\"quality-tier\", \"us\", 1600),\n}\n\ndef choose(task: str, tenant_regions: set[str]) -> Route:\n    route = ROUTES[task]  # Version this policy in production.\n    if route.region not in tenant_regions:  # Enforce data residency.\n        raise PermissionError(\"no_compliant_route\")\n    return route  # Provider failover must repeat these checks.","config":"gateway:\n  budgets:\n    max_input_tokens: 12000\n    max_output_tokens: 1600\n    tenant_daily_usd: 120\n  routing:\n    classify: {model: fast-tier, region: us}\n    research: {model: quality-tier, region: us}\n  response_validation:\n    reject_unknown_fields: true\n    max_schema_repair_attempts: 1","quiz":[{"q":"Which token dimension often dominates latency during long generation?","choices":["Table row count","Output/decode tokens","DNS TTL","Embedding vector dimension"],"answer":1,"why":"Autoregressive decoding adds serial generation time for each output token."},{"q":"Can JSON Schema validation guarantee that an answer is true?","choices":["Yes, if field names are descriptive","No, it validates shape, not truth","Only for temperature zero","Yes, with strict mode"],"answer":1,"why":"Schema compliance and semantic correctness are separate checks."},{"q":"Which property must a provider fallback preserve?","choices":["Identical sampling randomness","The same model brand","Security/residency policy constraints","The fastest token rate"],"answer":2,"why":"A fallback must not violate access, residency or data-handling obligations."},{"q":"Your primary inference provider returns sustained 429 errors during a launch. What should the runtime do?","choices":["Discard tenant residency rules","Use admission control, quota-aware routing and explicit degrade policy","Increase concurrent calls with no limits","Treat provider throttling as user authorization"],"answer":1,"why":"Use admission control, quota-aware routing and explicit degrade policy. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: Your primary inference provider returns sustained 429 errors during a launch. Which next action is operationally defensible?","choices":["Use admission control, quota-aware routing and explicit degrade policy","Discard tenant residency rules","Treat provider throttling as user authorization","Increase concurrent calls with no limits"],"answer":0,"why":"Use admission control, quota-aware routing and explicit degrade policy; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Tenant request","detail":"Task class and residency constraints"},{"name":"Routing policy","detail":"Approved model tier and fallback rules"},{"name":"Admission control","detail":"Per-tenant rate, cost and context caps"},{"name":"Inference backend","detail":"Hosted or GPU-served model"},{"name":"Validator","detail":"Schema and semantic checks"},{"name":"Usage ledger","detail":"Token costs, version and latency metrics"}],"simulation":"cost"},{"name":"Tools and Protocols","track":"Integration","hours":6,"summary":"Connect tools and MCP servers through enforceable schemas, identity propagation and isolated egress.","prerequisites":["Modules 1–4","HTTP, OAuth and JSON Schema familiarity"],"objectives":["Implement a safe function-tool adapter","Explain MCP roles, negotiation and transport considerations","Design per-tool authorization and side-effect policies"],"lessons":[{"title":"The function calling boundary","concept":"A tool schema advertises capability, arguments and expected output, but it is not an access-control system. Treat generated arguments as attacker-controlled. The dispatcher must authenticate the caller, authorize the exact resource, validate bounds and sanitize outputs.","internals":"Use an allowlisted registry with tool name, input schema, timeout, retry class, idempotency behavior, data classification and approval requirement. All write calls require a generated action_id and a pre-execution authorization check.","build":"Implement read_invoice(invoice_id) with tenant-filtered SQL and update_invoice as a separately approved capability. Log canonical argument hashes and tool response classification.","tradeoff":"Aggregating many broad tools increases accidental selection and injection exposure. Expose only task-relevant tools, preferably short-lived scoped capabilities.","failure":"If a document asks the model to invoke a dangerous admin tool, the dispatcher still denies it because retrieved content cannot grant authority.","field_note":"Registry review: read_invoice(invoice_id) accepts one required string and rejects unknown fields. The dispatcher derives tenant_id from the authenticated principal, never from JSON produced by the model. It verifies that the caller may access the exact invoice, then invokes a bounded vendor adapter. update_invoice_status is a separate tool with write scope, approval binding and stable action_id. Before calling either, emit a policy decision event with tool version and scope; do not emit raw OAuth tokens. A retrieved instruction requesting export_all_records is irrelevant because that capability is not registered for the task."},{"title":"MCP architecture and interoperability","concept":"Model Context Protocol separates hosts, clients and servers. A host orchestrates one or more MCP clients; servers advertise tools, resources or prompts. Transport, auth and extension semantics evolve: pin a specification/SDK version and verify compatibility for the deployed server and client.","internals":"The discovery phase lists server capabilities; the client validates tool schemas and builds only an approved registry. Local stdio and HTTP-based transports have different credential, isolation and network risks. The current published protocol includes a stateless core; do not assume a permanently connected session in new designs.","build":"Prototype a read-only MCP server for an internal catalog. Authenticate the remote connection, enforce audience and scope, and verify the same permissions again at the underlying record service.","tradeoff":"MCP reduces adapter friction, but does not supply least-privilege policy, reliable idempotency or output trust by itself.","failure":"Trusting a third-party tool description as an instruction channel risks tool poisoning; review versioned metadata and constrain declared capabilities.","field_note":"MCP interoperability lab: diagram the application host, one MCP client and a private catalog server exposing list and lookup operations. Version the tool metadata and test capability discovery. A remote transport requires authenticated routing, audience validation and appropriate HTTP-side authorization; a local stdio server inherits a different credential and process isolation boundary. Newer MCP versions may differ from earlier stateful examples, so test behavior against a pinned 2026-era specification and SDK rather than mixing snippets from incompatible releases. Review tool descriptions as untrusted extension metadata and restrict accessible capabilities at the host adapter."},{"title":"Reliable enterprise tool adapters","concept":"Adapters translate business APIs into typed results with bounded timeouts, retries, rate limits and circuit breakers. Separate retryable network errors from business conflict and auth failures. Use correlation IDs and redact data before returning it to the model.","internals":"Before side-effecting work, persist action intent and generate a stable idempotency key. During recovery, query authoritative target state before blind retry. If an API has no idempotency support, implement reconciliation and human review for ambiguous outcomes.","build":"Create a payment simulation tool that returns 409, 429 and timeout events. Demonstrate when to retry, back off, reconcile or stop.","tradeoff":"Thin adapters are easier to maintain but may leak inconsistent vendor contracts. Normalized adapters improve portability at the cost of lost provider-specific features.","failure":"A tool returns 200 with HTML instructions embedded in a data field. Treat it as untrusted data and exclude it from controlling the next tool permission.","field_note":"Unknown outcome case: an invoice-update API returns HTTP 503 before any write—transient retry may be appropriate with capped jitter. Another update times out after the vendor records the change. Retrying with a new action ID risks duplicate effects; query authoritative invoice status or use the vendor's supported idempotency key. A 403 means lack of authorization and must never enter a retry loop. A 409 indicates a version conflict and requires rereading target state. Instrument each distinct error class, and establish an escalation policy when reconciliation cannot establish whether the business change happened."}],"design":"Use the tool registry as the capability boundary: schemas aid usability; IAM and policy enforce access; observability proves what executed.","security":"Protect OAuth tokens, validate audiences, bound outbound destinations, treat tool output as untrusted and avoid unreviewed third-party tool descriptions.","runbook":"For unexpected tool writes, reconstruct principal → permission → action_id → approval → target resource audit sequence; revoke scope before retrying.","exercise":"Implement read and write invoice tools with JSON Schema, deny a cross-tenant invoice ID, then prove a duplicate action_id is idempotent.","expected":"Pass: no model text or MCP metadata can confer permission; writes have stable identity, action IDs and audit records.","reference":"MCP transports and authorization are version-sensitive; check your pinned protocol and SDK documentation before shipping. MCP 2026-07-28 uses a stateless request core, method/name routing headers and optional discovery; see docs/MCP_2026.md. Legacy 2025 handshakes are not interchangeable.","py":"def call_tool(principal, tool_name: str, raw_args: dict, registry):\n    spec = registry.get(tool_name)  # Approved tools only.\n    if spec is None:\n        raise PermissionError(\"tool_not_registered\")\n    args = spec.schema.validate(raw_args)  # Reject extra fields.\n    if not spec.policy.allows(principal, args):  # Resource-level auth.\n        raise PermissionError(\"access_denied\")\n    if spec.requires_approval and not spec.approved(principal, args):\n        return {\"status\": \"waiting_for_approval\"}\n    # Adapter owns timeouts, idempotency and output classification.\n    return spec.adapter.execute(args, principal=principal)","config":"tool:\n  name: update_invoice_status\n  input_schema:\n    type: object\n    additionalProperties: false\n    required: [invoice_id, status, action_id]\n    properties:\n      invoice_id: {type: string, minLength: 1}\n      status: {type: string, enum: [reviewed, disputed]}\n      action_id: {type: string, minLength: 12}\n  policy:\n    scope: invoices:write\n    approval_required: true\n    timeout_ms: 5000","quiz":[{"q":"What does publishing an MCP tool schema grant?","choices":["Permanent admin access","A guarantee of safe tool output","A description of callable interface, not permission","Exactly-once semantics"],"answer":2,"why":"Schemas describe the interface; the host/adapter still enforces authorization."},{"q":"What is required for secure multi-tenant tool writes?","choices":["Turn off tracing","Resource-level policy using authenticated context","Trust model-supplied tenant_id","Only use JSON outputs"],"answer":1,"why":"Tenant and principal identities must come from trusted authentication context."},{"q":"How should ambiguous network timeout after a write be handled?","choices":["Reconcile target state or use idempotency key","Always retry immediately","Assume success","Skip audit logs"],"answer":0,"why":"An uncertain outcome requires stable idempotency/reconciliation before another side effect."},{"q":"A retrieved tool description says to ignore current user permissions. What should the runtime do?","choices":["Grant tools requested by retrieved content","Skip tenant checks for faster reads","Treat tool metadata as untrusted; apply runtime IAM per action","Change the schema to bypass identity"],"answer":2,"why":"Treat tool metadata as untrusted; apply runtime IAM per action. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: A retrieved tool description says to ignore current user permissions. Which next action is operationally defensible?","choices":["Change the schema to bypass identity","Grant tools requested by retrieved content","Treat tool metadata as untrusted; apply runtime IAM per action","Skip tenant checks for faster reads"],"answer":2,"why":"Treat tool metadata as untrusted; apply runtime IAM per action; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Agent runtime","detail":"Proposes tool call from permitted registry"},{"name":"Policy/validator","detail":"Enforces schema and resource scopes"},{"name":"MCP client","detail":"Negotiates and invokes selected server capability"},{"name":"MCP server","detail":"Provides versioned tool interfaces"},{"name":"Enterprise adapter","detail":"Handles identity, retries and idempotency"},{"name":"System of record","detail":"Authoritative data and side effects"}],"simulation":"tools"},{"name":"Memory and Knowledge Systems","track":"Data","hours":7,"summary":"Build grounded retrieval and persistent memory without confusing similarity with truth or authority.","prerequisites":["Modules 1–5","Vector similarity and relational SQL concepts"],"objectives":["Design a permission-aware RAG pipeline","Specify ephemeral, episodic and durable memory lifecycles","Evaluate retrieval quality and provenance"],"lessons":[{"title":"Context engineering and memory tiers","concept":"A prompt is an assembled artifact with instruction hierarchy, task inputs, tool results, retrieved evidence and conversation state. Working memory is temporary per run; episodic memory stores previous events; durable semantic memory stores reviewed facts. Persist only data with an owner, purpose and retention policy.","internals":"Context assembly must allocate token budgets per source, rank evidence and distinguish instructions from quoted content. Summaries compress history but may distort commitments; preserve authoritative event records for audit and reconstructable facts.","build":"Define a context builder that reserves fixed tokens for system instructions, tool schemas and output, then fills the remainder with recent events and permission-filtered evidence.","tradeoff":"A very large window reduces some truncation but not distraction, relevance drift, policy injection or cost. Select context deliberately.","failure":"An old memory claiming an account was closed must not override the current system-of-record API. Assign data sources freshness and precedence.","field_note":"Context packing worksheet: a model allows 12,000 effective tokens. Reserve 1,500 for policy/tool schemas, 1,500 for output, 2,000 for recent active events and 7,000 for filtered retrieval. If retrieved evidence exceeds its budget, rerank and trim at coherent chunk boundaries while retaining citation IDs. Do not truncate security instructions, tool schemas or JSON output budgets to squeeze in one more document. If the system of record says a customer changed status yesterday but long-term memory says otherwise, use the live authoritative record and mark the memory stale for review. All persistent memory has purpose and retention metadata."},{"title":"RAG pipeline and retrieval evaluation","concept":"Ingestion uses source registration, extraction, normalization, chunking, metadata tags, embeddings and index versioning. Query uses auth filters, semantic and keyword retrieval, hybrid fusion, reranking and evidence assembly with citation IDs.","internals":"Apply access filters before candidates are exposed. In multi-tenant vector stores, physically or logically isolate namespaces and verify filters. Keep document version, tenant, ACL, chunk offsets, embedding model and checksum as metadata.","build":"Test a corpus of 100 labeled questions and measure recall@k, MRR or nDCG, citation precision and answer faithfulness. Compare chunk sizes, overlap, hybrid retrieval and reranking.","tradeoff":"Large chunks carry context but reduce precision; small chunks improve matching but can split concepts. Hybrid retrieval helps exact identifiers that dense embeddings miss.","failure":"When top-k sources are irrelevant, the model may confidently answer anyway. Require a retrieval quality gate and an explicit insufficient-evidence response.","field_note":"RAG recall experiment: label the three essential policy excerpts for 50 invoice questions. Run lexical, vector and hybrid retrieval at k=3, 5 and 10. Record recall@k, nDCG, percent of questions with no authorized evidence, average context tokens and answer citation precision. High vector similarity alone is not enough: a policy from another tenant might be the closest match but must be excluded before rank fusion. Use source version and ACL on each chunk. When a document update occurs, invalidate only affected chunks and trace which prior answers depended on the outdated version."},{"title":"Memory writes, deletion and lifecycle","concept":"Long-term memory writes are privilege-bearing operations. Treat candidate memories as claims awaiting schema validation, consent/purpose check, privacy classification and deduplication. Keep TTL and source reference so corrections and erasure propagate.","internals":"Use a separate write pipeline: propose → validate → policy → persist → index update. Reindexing and deletion may be asynchronous; reconcile the vector index with the authoritative store and maintain tombstones.","build":"Design a deletion exercise: remove a customer record, invalidate caches, tombstone vector chunks, stop future retrieval and verify erasure in supported stores and backups per policy.","tradeoff":"Episodic storage improves personalization but expands sensitive-data exposure and compliance obligations. Default to minimal memory unless value is validated.","failure":"Embedding deletion is not equivalent to deleting all original documents, cached excerpts and logs. Track the data lineage and retention schedule.","field_note":"Deletion runbook: a user asks for an eligible memory record to be removed. The authoritative source marks its record deleted or tombstoned; the index update queue removes derived embeddings; cache invalidation prevents stale excerpts from reentering context. Verify read paths filter tombstones immediately even if asynchronous physical deletion is pending. Document log retention, backups and lawful exceptions with the data owner. Avoid promising instantaneous erasure from immutable disaster-recovery backups unless the policy and architecture support it. Test that the same content cannot be reinserted by delayed ingestion events lacking version controls."}],"design":"Treat RAG as evidence retrieval, not instruction retrieval. Require citations, ACL filters, source freshness and quantitative retrieval tests.","security":"Exclude secrets and special-category data unless approved, enforce tenant ACL before retrieval and prevent retrieved text from becoming executable instruction.","runbook":"For incorrect answers, inspect retrieved chunk IDs, ACLs, rerank scores, chunk boundaries and source versions before tuning the language model.","exercise":"Create a 20-document RAG corpus with two tenants; run top-k=3 and top-k=8, measure recall and prove that cross-tenant documents are never returned.","expected":"Pass: recall is measured on labeled questions, answers cite source IDs, and a forbidden document returns zero evidence regardless of similarity.","reference":"Context composition should maintain a provenance ledger: each claim must map to a valid source version or be labeled unverified.","py":"def retrieve(query, principal, embed, vector_db, rerank):\n    # Metadata authorization is enforced at query time.\n    allowed = {\"tenant_id\": principal.tenant_id,\n               \"acl_groups\": {\"$in\": principal.groups}}\n    candidates = vector_db.search(embed(query), top_k=30,\n                                  filter=allowed)\n    # Hybrid keyword results can be merged here before reranking.\n    ranked = rerank(query, candidates)[:5]\n    return [{\"source_id\": x.source_id, \"version\": x.version,\n             \"quote\": x.text} for x in ranked]  # Preserve provenance.","config":"retrieval:\n  input:\n    chunk_tokens: 450\n    overlap_tokens: 75\n    embedding_version: embed-v2\n  query:\n    lexical_top_k: 20\n    vector_top_k: 30\n    rerank_top_k: 5\n    min_relevance_score: 0.68\n  security:\n    enforce_tenant_acl_before_fetch: true\n    include_source_versions: true\n    reject_instructional_content_as_authority: true","quiz":[{"q":"When must RAG access controls be applied?","choices":["Before returning candidate chunks","Only in the browser","Only after the model answers","When users complain"],"answer":0,"why":"Unauthorized chunks must not enter prompt context in the first place."},{"q":"What does cosine similarity establish?","choices":["Document freshness","Semantic proximity, not truth","Permission to access content","Factual accuracy"],"answer":1,"why":"Vector closeness is a ranking heuristic, not evidence of truth or permission."},{"q":"What is needed to support deletion of durable memory?","choices":["A lineage, tombstone and downstream invalidation plan","A larger context window","More embedding dimensions","Delete the search field only"],"answer":0,"why":"Deletion must reach source records, derived indexes and caches according to policy."},{"q":"Similarity search finds a perfect answer in another customer's private index. What should the runtime do?","choices":["Only hide the source document title","Filter by authenticated tenant ACL before ranking or returning","Assume embeddings obscure the data","Show the highly relevant result anyway"],"answer":1,"why":"Filter by authenticated tenant ACL before ranking or returning. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: Similarity search finds a perfect answer in another customer's private index. Which next action is operationally defensible?","choices":["Show the highly relevant result anyway","Assume embeddings obscure the data","Only hide the source document title","Filter by authenticated tenant ACL before ranking or returning"],"answer":3,"why":"Filter by authenticated tenant ACL before ranking or returning; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Content sources","detail":"Versioned documents and trusted ACL metadata"},{"name":"Ingestion","detail":"Parsing, chunking, embedding and dedupe"},{"name":"Indexes","detail":"Semantic + keyword candidate stores"},{"name":"Authorized filter","detail":"Tenant and document ACL applied before retrieval"},{"name":"Reranker","detail":"Selects useful grounded excerpts"},{"name":"Context builder","detail":"Packs evidence with source citations"},{"name":"Answer validator","detail":"Checks citations and sufficiency"}],"simulation":"rag"},{"name":"Multi-Agent Orchestration","track":"Architecture","hours":7,"summary":"Coordinate concurrent specialists with durable state, delegation contracts and deterministic failure semantics.","prerequisites":["Modules 1–6","Asynchronous programming and messaging"],"objectives":["Build a task DAG with fan-out/fan-in","Choose state ownership and event contracts","Handle partial failure, replay and cancellation"],"lessons":[{"title":"Delegation contracts and state ownership","concept":"Multiple agents are separate workers with scoped goals, deadlines, capabilities and return types, not a group chat with unlimited shared authority. The orchestrator owns global state and conflict decisions. Specialists can return evidence, proposals or typed artifacts.","internals":"Assign parent_run_id, child_id, input version and correlation IDs. Maintain an append-only event history plus a materialized state snapshot. Use compare-and-swap on run version to prevent stale workers overwriting newer transitions.","build":"Design a review workflow in which researcher and compliance reviewer return independent reports. The coordinator merges only after both have reached an allowed terminal state.","tradeoff":"Shared mutable memory makes coordination simple initially but creates races, leakage and hard-to-reproduce bugs. Explicit message passing improves isolation.","failure":"A late child completion after parent cancellation must be ignored for state transitions; isolate late side effects with preflight cancellation checks.","field_note":"Delegation consistency case: a coordinator launches a policy specialist and a finance specialist with the same parent_run_id and a request_version=7. Policy returns first. Before finance finishes, a customer record changes to version 8. At join, the coordinator must not merge outputs whose underlying source versions are incompatible without validation. Persist the parent state in SQL using compare-and-swap; a duplicate child completion event is recorded once. Specialists receive only necessary data and their own tool scopes. A completed child cannot autonomously commit an external account update merely because the supervisor gave it a goal."},{"title":"Fan-out, fan-in and durable queues","concept":"Fan-out dispatches independent tasks in parallel; a join waits for all, quorum or deadline. A queue absorbs bursts and decouples execution from request handling. Workers acknowledge only after durable state is committed.","internals":"Use per-tenant concurrency caps and global rate budgets. At a join, store child completion IDs and aggregate deterministically; duplicate completion messages are common in redelivery scenarios.","build":"Implement parallel policy and finance checks with a 45-second deadline. If finance is unavailable, return a typed partial decision and route to human review.","tradeoff":"More parallel agents do not guarantee lower latency: slowest required child sets join latency and total spend rises. Parallelize only independent tasks.","failure":"If all workers retry the same failing model endpoint, a queue amplifies an outage. Add shared circuit breakers, dead-letter destinations and retry ceilings.","field_note":"Fan-out model: two checks each require 12 seconds. Sequential operation costs about 24 seconds of wall time; concurrent operation can reduce the join to roughly 12 seconds plus orchestration if both finish normally. However, two concurrent model calls consume their individual token quotas, so provider-level rate limits may erase gains. Set a join deadline of 20 seconds. If one branch fails, persist partial evidence and choose needs_review, never treat missing compliance evidence as approval. Deduplicate completion messages by child ID and include a deadline timestamp rather than trusting worker-local clocks for terminal transitions."},{"title":"Workflow engines and replay safety","concept":"Long-running orchestrators need checkpointed state and durable timers. Replay-safe workflow logic must not repeat nondeterministic side effects; external API invocations belong in idempotent activities with recorded results.","internals":"Use a workflow engine for weeks-long processes, approvals and compensation. Version workflow definitions and state schemas so in-flight instances survive new deployments. Separate pure decision functions from side-effecting adapters.","build":"Inject a crash between authorization and tool execution, and another after execution but before acknowledgment. Verify both converge to one business outcome.","tradeoff":"Custom orchestration gives maximal flexibility but durable workflow engines avoid many timer, resume and replay pitfalls. The tradeoff is operational complexity and framework lock-in.","failure":"Replay with a changed prompt/model may alter decisions. Pin decision artifacts and workflow versions; do not recompute completed authoritative actions.","field_note":"Replay injection: the worker receives step 5, executes a vendor-side change, writes a result and crashes before message acknowledgement. On redelivery, a new worker reads the run ledger, retrieves the previous action_id and asks the vendor or local adapter to reconcile before any repeat call. If an engine reruns a node when resuming an interrupt, code before the pause may execute again; keep irreversible work in separate idempotent activities. Upgrade the workflow definition while run instances are active and verify schema migrations preserve old instances. Measure percentage of runs that are recoverable without manual intervention."}],"design":"Keep global state in one durable controller; tasks have typed inputs/outputs, deadlines, idempotency and explicit join policies.","security":"Propagate scoped identities, validate output classification and require action-level authorization after any handoff.","runbook":"When a fan-in never completes, inspect each child terminal state, oldest message age, deadline timer and omitted/duplicate completion events.","exercise":"Build a two-branch fan-out flow, simulate one branch timing out and one response arriving twice, then verify one join outcome.","expected":"Pass: no duplicate side effects, cancellation is respected and incomplete joins produce an explicit partial/escalated status.","reference":"Every distributed workflow needs causal IDs and event-version semantics, not just conversation transcripts.","py":"import asyncio\n\nasync def run_parallel(policy_agent, finance_agent, request):\n    # Independent branches may run concurrently.\n    tasks = [asyncio.create_task(policy_agent(request)),\n             asyncio.create_task(finance_agent(request))]\n    done, pending = await asyncio.wait(tasks, timeout=45)\n    for task in pending:\n        task.cancel()  # Also propagate durable cancellation state.\n    results = [t.result() for t in done if not t.cancelled() and t.exception() is None]\n    if pending or len(results) != 2:\n        return {\"status\": \"needs_review\", \"evidence\": results}\n    return {\"status\": \"ready_for_validation\", \"evidence\": results}","config":"orchestration:\n  max_child_jobs: 6\n  tenant_concurrency: 8\n  join:\n    mode: all\n    deadline_seconds: 45\n    on_timeout: human_review\n  recovery:\n    max_activity_attempts: 3\n    retry_backoff: exponential_jitter\n    dead_letter_after_exhaustion: true","quiz":[{"q":"In an all-branches fan-in, what drives total latency?","choices":["The fastest child","The number of prompts in a system message","Always the coordinator CPU","The slowest required child"],"answer":3,"why":"The join waits for the slowest required branch or its deadline."},{"q":"Who should own authoritative run state?","choices":["Whichever specialist last replied","Each worker independently","The shared chat transcript","A durable coordinating service"],"answer":3,"why":"Single ownership plus versioned transitions reduces conflicting state updates."},{"q":"Why is a stable idempotency key needed during replay?","choices":["To reduce token length","To prevent repeated business side effects","To train the supervisor","To encrypt embeddings"],"answer":1,"why":"Retries or replay can re-run activities unless their effects are deduplicated."},{"q":"A delegated task is retried after the parent worker crashes. What should the runtime do?","choices":["Create a new payment ID for the same work","Ignore dead-letter events","Use in-memory state only","Resume by stable child ID and reconcile task state before side effects"],"answer":3,"why":"Resume by stable child ID and reconcile task state before side effects. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: A delegated task is retried after the parent worker crashes. Which next action is operationally defensible?","choices":["Create a new payment ID for the same work","Ignore dead-letter events","Use in-memory state only","Resume by stable child ID and reconcile task state before side effects"],"answer":3,"why":"Resume by stable child ID and reconcile task state before side effects; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Coordinator","detail":"Durable workflow and deadlines"},{"name":"Task broker","detail":"Queues typed child jobs"},{"name":"Research agent","detail":"Gathers scoped evidence"},{"name":"Policy agent","detail":"Returns policy classification"},{"name":"Finance agent","detail":"Returns bounded numeric analysis"},{"name":"Join/reconcile","detail":"Combines results; handles partial completion"},{"name":"Review gate","detail":"Controls subsequent side effects"}],"simulation":"multi"},{"name":"Agent Frameworks","track":"Architecture","hours":6,"summary":"Evaluate frameworks on state semantics, execution guarantees, observability and operational fit—not marketing claims.","prerequisites":["Modules 1–7","Comfort with Python packaging"],"objectives":["Compare LangGraph, AutoGen, CrewAI and OpenAI Agents SDK","Select a workflow engine when durable execution is required","Create a framework-independent evaluation rubric"],"lessons":[{"title":"Framework primitives and portability","concept":"Every framework eventually maps to models, tools, state transitions, tool dispatch and tracing. Compare those primitives and their version-specific guarantees before adopting a higher-level role or team abstraction. Preserve business logic in independent services and typed domain contracts.","internals":"Framework adapters should inject model gateways, tool registries and state storage. Put permission checks and idempotency in the underlying app layer so a library upgrade cannot bypass policy.","build":"Write a framework comparison matrix with durability, tool routing, HITL interrupt, state checkpoints, concurrency, tracing, deployment complexity and test seam columns.","tradeoff":"Highly abstract agent-team frameworks speed demos but may hide retries and state ownership. Lower-level SDKs require more orchestration code but clarify execution.","failure":"An SDK update changes tool-call schema or tracing defaults. Pin versions, run contract tests and use canary rollout with rollback.","field_note":"Framework procurement rubric: define a uniform test harness with 25 normal tasks, 10 simulated API failures, 10 authorization denials and 5 24-hour approval pauses. Assign scoring weights to recovery, auth integration, traceability, concurrency, state migration and vendor exit. Do not score a feature as present merely because a framework homepage mentions 'durability'; prove it by killing a worker mid-activity. A pure Python controller may outperform a multi-agent library for fixed short workflows. Keep domain interfaces portable so changing SDKs does not require rewriting the corporate policy system or database constraints."},{"title":"LangGraph and durable state graphs","concept":"LangGraph models workflows as nodes and edges with shared typed state, checkpointing and interruption support. It is well suited to cyclic graphs that need durable pauses and resumptions. Exactly which persistence adapters and interrupt APIs are available depends on the pinned version.","internals":"The graph runner transitions through defined nodes; checkpoints track state and can resume with a thread/run identifier. For production, use a durable checkpointer and ensure node side effects are idempotent on retry/resume.","build":"Prototype nodes for retrieve → draft → validate, with a conditional edge to human review. Inject a process restart at an interrupt and confirm state recovery.","tradeoff":"Graph visualizations aid reasoning but add state schema/versioning work. An external durable workflow engine may still be necessary for cross-system sagas.","failure":"An interrupted node can be replayed. Any work done before the interruption must be side-effect-safe or moved behind a checkpointed activity.","field_note":"LangGraph prototype: construct state keys for request_id, retrieved_documents, draft, validation_errors and approval_state. Define retrieve, draft, validate and approval nodes with explicit edges. Attach a durable checkpoint backend and an identifier that associates resumed work with the same run. Trigger an approval interrupt, restart the execution process and resume with a server-validated decision. Test whether code before the interrupt can rerun, then relocate side effects behind idempotent activities. Pin library and checkpointer versions and include a migration test using an instance created before deployment. Do not confuse checkpoint persistence with authorized access."},{"title":"Agents SDK, AutoGen, CrewAI and alternatives","concept":"OpenAI Agents SDK emphasizes code-first agents, tools, handoffs, guardrails and tracing; the application still owns operational deployment, durable business state and permissions. AutoGen and CrewAI expose multi-agent collaboration abstractions; evaluate actual behavior in the versions your team will ship.","internals":"Implement the same three-step support flow with your chosen framework and a plain reference controller. Compare trace completeness, replay semantics, approval behavior, effort, token cost and error surfacing.","build":"Build a decision record recommending: plain controller for simple fixed flows; LangGraph for checkpointed graphs; an SDK for agent-loop primitives; a durable workflow engine for very long-running cross-service transactions.","tradeoff":"A multi-agent library does not create distributed exactly-once writes or enterprise authorization by default. Treat it as orchestration tooling, not a security boundary.","failure":"An agent handoff produces a convincing answer without respecting a write approval. Contract tests must exercise all handoff destinations and tool policies.","field_note":"SDK trade-off experiment: implement the same read-only support workflow in a lightweight Agents SDK and in a role-based multi-agent system. Compare tool-call schemas, per-tool guardrails, tracing visibility, handoff ownership and cancellation. For an approval lasting two days, external durable workf

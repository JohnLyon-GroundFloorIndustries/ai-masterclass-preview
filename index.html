RPO promises. Estimate model spend using separate cached input, uncached input and output prices and include retries, vector indexing, workers, storage and review labor. The launch committee signs evidence and a rollback owner is on call for the canary window."}],"design":"Build one authoritative workflow state machine, an auditable permissioned tool proxy and reproducible deployment before increasing agent autonomy.","security":"Require demonstrable least privilege, egress controls, record-level tenant isolation, redaction, approval checks and incident response ownership.","runbook":"For simulated regional loss, restore SQL snapshot and event stream, replay outbox idempotently, verify missing events and compare actual RTO/RPO.","exercise":"Complete all twelve capstone gates in the dedicated Capstone Studio. Attach measurable evidence for each gate and run the final assessment.","expected":"Pass: all twelve artifacts have explicit decisions and testable criteria, with zero unresolved critical security or recoverability gaps.","reference":"Reference architecture is a design starting point, not a certified deployment. Every real environment requires validation of cloud, vendor and regulatory assumptions.","py":"def production_readiness(evidence: dict) -> dict:\n    required = (\n        \"requirements\", \"topology\", \"delegation\", \"routing\",\n        \"tools\", \"retrieval\", \"security\", \"deployment\",\n        \"resilience\", \"observability\", \"cost\", \"handoff\",\n    )\n    missing = [item for item in required if not evidence.get(item)]\n    # Also enforce independent hard security tests before launch.\n    return {\"status\": \"review_required\" if missing else \"ready_for_audit\",\n            \"missing_artifacts\": missing}\n\n# Ready for audit is NOT automatic production authorization.","config":"production_gate:\n  owners: [product, platform, security, data, on_call]\n  slo:\n    api_availability: 0.999\n    eligible_read_task_success: 0.995\n  hard_blocks:\n    - unauthorized_write_detected\n    - failed_tenant_isolation_test\n    - untested_restore_procedure\n    - missing_tool_idempotency\n  rollout:\n    tenant_canary_percent: 5\n    rollback_owner: platform_on_call","quiz":[{"q":"Which is the authoritative home for run and approval state?","choices":["The client browser","A durable transactional state store","The vector index","Only the model prompt"],"answer":1,"why":"Workflow and approval outcomes must survive restarts and be transactionally auditable."},{"q":"What proves disaster recovery readiness?","choices":["A high-capacity GPU","An architecture slide","A documented and timed restore test","Two copies of the Dockerfile"],"answer":2,"why":"Only tested restore/replay procedures support claimed recovery objectives."},{"q":"What is the proper status after all design artifacts are drafted?","choices":["Ready for audit and launch authorization","All security risk eliminated","Automatically live in production","No further testing needed"],"answer":0,"why":"Evidence enables review, but does not replace operational approvals or real-world testing."},{"q":"The capstone demo passes a multiple-choice exam but has never restored its database. What should the runtime do?","choices":["Skip RTO requirements because it is an AI system","Treat quiz score as disaster recovery proof","Withhold production signoff until a timed restore and incident drill passes","Mark SLO as achieved without measurements"],"answer":2,"why":"Withhold production signoff until a timed restore and incident drill passes. A trusted runtime must enforce this, independent of generated text."},{"q":"An incident report states: The capstone demo passes a multiple-choice exam but has never restored its database. Which next action is operationally defensible?","choices":["Treat quiz score as disaster recovery proof","Skip RTO requirements because it is an AI system","Withhold production signoff until a timed restore and incident drill passes","Mark SLO as achieved without measurements"],"answer":2,"why":"Withhold production signoff until a timed restore and incident drill passes; alternatives introduce unacceptable ambiguity or scope risk."}],"nodes":[{"name":"Identity + API","detail":"Tenants, intake and quotas"},{"name":"SQL + outbox","detail":"Durable workflow and audit intentions"},{"name":"Broker + workers","detail":"Parallel scoped agent execution"},{"name":"Model gateway","detail":"Policy-aware inference"},{"name":"RAG + object store","detail":"Versioned authorized knowledge"},{"name":"Tool proxy + MCP","detail":"Controlled enterprise writes"},{"name":"Approval + audit","detail":"Human decision and evidence"},{"name":"Monitoring + DR","detail":"SLO, evaluation and recovery"}],"simulation":"topology"}];
const GLOSSARY = [{"term":"Agent loop","group":"Fundamentals","def":"A bounded control cycle that obtains a model decision, validates it, invokes permitted tools and verifies its outcome."},{"term":"Agentic workflow","group":"Fundamentals","def":"A workflow combining model-directed choices with application-owned transitions, budgets and tools."},{"term":"Autonomy boundary","group":"Fundamentals","def":"The precise class of decisions and actions an agent may take without independent approval."},{"term":"ReAct","group":"Patterns","def":"A reasoning-and-action pattern that alternates tool decisions and environment observations."},{"term":"Plan-and-execute","group":"Patterns","def":"A control architecture that separates high-level task decomposition from executing individual steps."},{"term":"Reflection","group":"Patterns","def":"A bounded validation or critique step that compares outputs against explicit acceptance criteria."},{"term":"Supervisor-worker","group":"Patterns","def":"A coordination model with a central controller assigning scoped tasks to specialist workers."},{"term":"State machine","group":"Fundamentals","def":"An explicit set of workflow states and permitted transitions enforced by deterministic code."},{"term":"Model gateway","group":"Inference","def":"A service that mediates provider routing, rate limits, budgets, credentials and telemetry."},{"term":"Time to first token","group":"Inference","def":"Elapsed time from a model request until the first output token becomes available."},{"term":"KV cache","group":"Inference","def":"Stored attention keys and values used to avoid recomputing prior sequence representations during inference."},{"term":"Continuous batching","group":"Inference","def":"An inference scheduling technique that groups and re-groups sequences during execution for higher GPU utilization."},{"term":"Context window","group":"Inference","def":"The maximum input-plus-output token capacity of a model request subject to provider limits."},{"term":"Structured output","group":"Inference","def":"Model output restricted to an agreed machine-readable schema, requiring additional semantic validation."},{"term":"Prefix cache","group":"Inference","def":"Reuse of computation for an identical authorized prefix, subject to isolation and cache validity constraints."},{"term":"Prompt caching","group":"Inference","def":"Provider or application reuse of eligible prompt processing to reduce repeated work or input-token cost."},{"term":"Token budget","group":"Inference","def":"An upper bound on input, output or cumulative tokens available to a run or tenant."},{"term":"Model routing","group":"Inference","def":"Selecting a model backend using constraints such as quality, task class, region, latency and cost."},{"term":"Rate limit","group":"Infrastructure","def":"A cap on request or token throughput enforced by a dependency or gateway."},{"term":"Tool schema","group":"Tools","def":"A description of a tool’s accepted arguments and return shape; not an authorization grant."},{"term":"Function calling","group":"Tools","def":"A mechanism for a model to propose a structured invocation that a trusted runtime may execute."},{"term":"MCP","group":"Tools","def":"Model Context Protocol, a protocol for exposing interoperable tools, resources and prompts between hosts/clients and servers."},{"term":"MCP host","group":"Tools","def":"The application that orchestrates an assistant and manages MCP client connections and user interaction."},{"term":"MCP server","group":"Tools","def":"A process or endpoint that advertises capabilities through MCP and executes approved requests."},{"term":"MCP tool poisoning","group":"Security","def":"Malicious or misleading tool metadata that attempts to influence agent behavior or tool selection."},{"term":"OAuth scope","group":"Security","def":"A constrained set of permissions authorized for a client or principal when calling an API."},{"term":"ABAC","group":"Security","def":"Attribute-based access control, evaluating subject, resource, action and environmental attributes."},{"term":"RBAC","group":"Security","def":"Role-based access control, assigning permissions through roles held by a principal."},{"term":"Workload identity","group":"Security","def":"Authentication tied to an executing service/workload instead of a shared static credential."},{"term":"Least privilege","group":"Security","def":"Granting only the minimal actions, resources and duration needed for a task."},{"term":"Zero trust","group":"Security","def":"A security approach that authenticates and authorizes each access rather than trusting network location."},{"term":"Prompt injection","group":"Security","def":"An attack where lower-trust content attempts to override higher-trust instructions or induce unauthorized actions."},{"term":"Data exfiltration","group":"Security","def":"Unauthorized transfer of protected information outside approved boundaries."},{"term":"SSRF","group":"Security","def":"Server-side request forgery, where untrusted input induces a service to access unapproved network destinations."},{"term":"Sandbox","group":"Security","def":"A restricted process or execution environment limiting filesystem, network and system capabilities."},{"term":"Defense in depth","group":"Security","def":"Layering independent controls so that failure of one barrier does not imply full compromise."},{"term":"Audit log","group":"Governance","def":"An attributable, durable record of actions, approval decisions and material state changes."},{"term":"RAG","group":"Knowledge","def":"Retrieval-augmented generation, building model context from search evidence selected at query time."},{"term":"Embedding","group":"Knowledge","def":"A learned vector representation useful for ranking semantic similarity between inputs."},{"term":"Vector database","group":"Knowledge","def":"A store or index optimized to search vectors by a similarity metric with metadata filters."},{"term":"Hybrid search","group":"Knowledge","def":"Retrieval combining semantic and lexical methods, often followed by fusion or reranking."},{"term":"Reranking","group":"Knowledge","def":"A second-stage model or algorithm that orders retrieved candidates for final evidence selection."},{"term":"Recall@k","group":"Evaluation","def":"The share of relevant items recovered among the top k candidates in an evaluated query set."},{"term":"MRR","group":"Evaluation","def":"Mean reciprocal rank, the average inverse rank of the first relevant result."},{"term":"nDCG","group":"Evaluation","def":"Normalized discounted cumulative gain, a ranking metric that rewards relevant results appearing earlier."},{"term":"Faithfulness","group":"Evaluation","def":"The degree to which a generated answer is supported by the evidence cited or supplied."},{"term":"Citation provenance","group":"Knowledge","def":"A mapping from a claimed fact to the exact source ID, version and location supporting it."},{"term":"Chunking","group":"Knowledge","def":"Dividing documents into retrieval units with size, overlap and semantic-boundary tradeoffs."},{"term":"TTL","group":"Knowledge","def":"Time-to-live, the duration after which a cached or retained record should expire."},{"term":"Episodic memory","group":"Knowledge","def":"Storage of events from previous interactions or executions with provenance and retention controls."},{"term":"Working memory","group":"Knowledge","def":"Short-lived context and task state needed during one active execution."},{"term":"Semantic memory","group":"Knowledge","def":"Long-lived reviewed facts or concepts retained across specific execution episodes."},{"term":"Checkpoint","group":"Orchestration","def":"A durable snapshot or state record from which a paused or interrupted workflow can resume."},{"term":"Durable execution","group":"Orchestration","def":"Running workflows whose state, timers and outcomes survive process crashes or deployments."},{"term":"Fan-out","group":"Orchestration","def":"Launching multiple independent child tasks from one coordinating step."},{"term":"Fan-in","group":"Orchestration","def":"Combining multiple child outcomes according to an all, quorum or deadline rule."},{"term":"Idempotency","group":"Reliability","def":"The property that applying an operation again using the same identity does not create an additional business effect."},{"term":"At-least-once delivery","group":"Reliability","def":"A message transport guarantee that may redeliver messages when acknowledgements are lost."},{"term":"Dead-letter queue","group":"Reliability","def":"A destination for messages that have exceeded allowed processing attempts or validation bounds."},{"term":"Transactional outbox","group":"Reliability","def":"A design that writes business state and publishable event intent in one database transaction."},{"term":"Saga","group":"Reliability","def":"A distributed workflow of local transactions and compensating operations for partial failure."},{"term":"Compensating action","group":"Reliability","def":"A follow-up business action attempting to counteract an earlier committed operation."},{"term":"Backpressure","group":"Scalability","def":"Limiting intake or concurrency to prevent queues or downstream services from being overwhelmed."},{"term":"Little's Law","group":"Scalability","def":"In stable flow, average items in the system L equals arrival rate λ times average time W."},{"term":"Utilization","group":"Scalability","def":"Offered load divided by service capacity; congestion rises near complete saturation."},{"term":"Circuit breaker","group":"Reliability","def":"A control that temporarily blocks calls to an unhealthy dependency and probes recovery cautiously."},{"term":"Exponential backoff","group":"Reliability","def":"A retry schedule with delays growing exponentially up to a configured cap."},{"term":"Jitter","group":"Reliability","def":"Randomized variation in retry delay to reduce synchronized traffic bursts."},{"term":"Bulkhead","group":"Reliability","def":"Isolation of resource pools to prevent one failing tenant or dependency from exhausting all capacity."},{"term":"RPO","group":"Operations","def":"Recovery point objective: the maximum acceptable amount of data loss measured in time."},{"term":"RTO","group":"Operations","def":"Recovery time objective: the maximum acceptable time to restore a service after a disruption."},{"term":"SLO","group":"Operations","def":"Service level objective: an explicit target for an availability, latency or outcome service-level indicator."},{"term":"SLI","group":"Operations","def":"Service level indicator: a quantitative metric reflecting a meaningful service outcome."},{"term":"Error budget","group":"Operations","def":"The tolerated unreliability remaining under an SLO over a chosen measurement window."},{"term":"Distributed trace","group":"Observability","def":"A causally connected set of spans representing one end-to-end request across services."},{"term":"Span","group":"Observability","def":"A timed operation record within a trace, with parent relationship and attributes."},{"term":"OpenTelemetry","group":"Observability","def":"An open set of instrumentation conventions and libraries for traces, metrics and logs."},{"term":"Golden dataset","group":"Evaluation","def":"A curated, versioned set of representative tasks and expected outcomes used for regression tests."},{"term":"LLM judge","group":"Evaluation","def":"A model-based evaluator scoring outputs or trajectories against a rubric, requiring calibration."},{"term":"Canary rollout","group":"Deployment","def":"Limited exposure of a new release to representative traffic before broader promotion."},{"term":"SBOM","group":"Deployment","def":"Software bill of materials identifying included packages and dependencies for security analysis."},{"term":"Infrastructure as code","group":"Deployment","def":"Managing cloud and platform configuration through version-controlled declarative definitions."},{"term":"NetworkPolicy","group":"Deployment","def":"A Kubernetes resource specifying allowed ingress and egress traffic for selected pods."},{"term":"Horizontal autoscaling","group":"Deployment","def":"Increasing or decreasing replicas to match measurable demand and capacity policy."},{"term":"Separation of duties","group":"Governance","def":"A control requiring distinct authorized parties for proposing and approving critical actions."},{"term":"Human-in-the-loop","group":"Governance","def":"Explicit human oversight, decision or correction embedded within an automated process."},{"term":"Immutable audit event","group":"Governance","def":"A tamper-evident record that should not be silently altered after its creation."},{"term":"Data residency","group":"Governance","def":"The permitted geographic location for processing or storing a specified class of data."},{"term":"System of record","group":"Integration","def":"The authoritative application or dataset for a specific business entity or field."},{"term":"Anti-corruption layer","group":"Integration","def":"A domain adapter isolating the application from legacy/vendor-specific data semantics."},{"term":"Change data capture","group":"Integration","def":"Capturing committed data changes to propagate events or synchronize downstream systems."},{"term":"Optimistic concurrency","group":"Reliability","def":"Detecting conflicting updates using resource versions or compare-and-swap checks."},{"term":"Computer-use agent","group":"Advanced","def":"An agent that perceives and operates software user interfaces under constrained action policies."},{"term":"Adaptive orchestration","group":"Advanced","def":"Changing model routes or workflow choices using evaluated signals while preserving fixed safety policies."},{"term":"Model drift","group":"Advanced","def":"A measurable change in the relation between input distributions, behavior and desired outcomes."},{"term":"Policy-as-code","group":"Governance","def":"Representing authorization or infrastructure compliance policies in testable, version-controlled logic."}];
const CAPSTONE = [{"category":"Requirements","title":"Requirements definition & SLOs","task":"Specify actors, read/write cases, user journeys, PII classifications, task volume, p95 latency and availability targets.","criteria":"A requirements table, measurable task success/availability SLOs, prohibited actions and explicit non-goals.","guide":"Reference: 250,000 runs/month; 99.9% API uptime; ≥99.5% valid read-only completions within 45s; zero unauthorized account writes. Record tenant scope, retention and 3-tier priority."},{"category":"Architecture","title":"Component diagram & topology","task":"Define zones, networks, orchestrator, SQL/outbox, queue, workers, model router, retrieval, MCP, approval service and audit pipeline.","criteria":"Label every trust boundary, authoritative datastore, network egress, AZ and data flow; explain worker failure recovery.","guide":"Reference: private multi-AZ API → SQL run ledger/outbox → broker → bounded worker pool → policy-aware model gateway + permissioned RAG/tool proxy; independent audit events and tracing."},{"category":"Agents","title":"Agent design & delegation","task":"Define coordinator, research, policy and action specialists with scoped capabilities, event contracts, joins and deadlines.","criteria":"Typed input/output schemas, action budget, failure state, fan-in policy and at least one handoff risk mitigation.","guide":"Reference: research and policy read-only parallel; supervisor validates both; action executor receives a fixed approved action only. Use parent/child IDs and 45s read-path join deadline."},{"category":"Inference","title":"Model selection & inference","task":"Choose task routes, fallback, request admission, context/token limits, residency, safety constraints and benchmarking method.","criteria":"Per-task model tier, latency/cost assumption table, fallback policy and p95/token evaluation with representative inputs.","guide":"Reference: fast tier for low-risk classification, quality tier for grounded synthesis, required residency check before routing/fallback; 12k input and 1.6k output caps."},{"category":"Connectivity","title":"Tool integration & MCP","task":"List enterprise tools and MCP servers, identity propagation, read/write scopes, schemas and error semantics.","criteria":"At least three tool contracts with schemas, owners, idempotency behavior, approval requirement and network egress constraints.","guide":"Reference: read_ticket (read), read_invoice (read), update_invoice (write with approval). MCP host/client/server responsibilities, pinned protocol version and token audience enforcement."},{"category":"Knowledge","title":"RAG & persistent memory","task":"Design ingestion, ACL-aware retrieval, indexing, chunking, reranking, memory retention and deletion.","criteria":"Tenant filtering before candidate retrieval; source version IDs; a retrieval evaluation plan and tombstone/deletion tests.","guide":"Reference: object storage + hybrid index; source_version, tenant ACL, chunk checksum and embedding model version; top30 retrieve → top5 rerank; measured recall@5."},{"category":"Trust","title":"Security & IAM controls","task":"Create a threat model and authorization matrix for prompts, tools, models, sandboxing and sensitive data flows.","criteria":"Five abuse cases with mitigation, detector, owner and hard test; separation of duties and data classification boundaries.","guide":"Reference: all tool calls use principal scopes + resource ABAC, egress allowlist, no raw secrets in model prompts, audited server-side write approvals, injection red-team tests."},{"category":"Delivery","title":"Containers, cloud deployment & CI/CD","task":"Specify immutable images, infrastructure as code, secret delivery, rolling/canary releases and versioned schema migrations.","criteria":"Deployment manifests, signed digest, policy checks, canary stops and an actionable rollback procedure with DB compatibility.","guide":"Reference: Kubernetes API/worker deployments, SQL managed primary/standby, external broker, workload identities, resource requests, graceful SIGTERM, multi-AZ, 5% tenant canary."},{"category":"Resilience","title":"Scale, failure recovery & DR","task":"Plan queue backpressure, retry policy, idempotency, regional disaster recovery and tested restore of state and events.","criteria":"Capacity estimate using arrival and service rates; explicit RTO/RPO, retry table, idempotency test and measured restore drill.","guide":"Reference: per-tenant inflight caps, exponential jitter for 429/503 only, DLQ with owner, SQL backup restore and outbox replay, secondary region subject to data residency."},{"category":"Monitoring","title":"Observability, tracing & evaluations","task":"Design structured spans, audit events, SLI dashboards, offline and online evaluation suites, alerts and red-team regression gates.","criteria":"Trace/span schema, dataset versions, 10 golden tasks, zero-violation security gate, p95 SLO and on-call alert routes.","guide":"Reference: trace_id across broker, model/tool spans with token and duration metrics; audit is unsampled; redacted payloads; measured citation precision and injection resilience."},{"category":"Economics","title":"Costs & optimization","task":"Estimate monthly spend using input/output/cache token rates plus compute, storage, egress, telemetry, retries and review labor.","criteria":"A transparent formula with unit assumptions, 1× and 3× demand cases, budget caps, cost per successful task and savings trade-offs.","guide":"Reference: runs × (uncached input million tokens × price + cached input × price + output × price), then add provider retries, worker hours, storage and human review."},{"category":"Operations","title":"Readiness, ownership & handoff","task":"Build the production readiness package for engineering, security, SRE, operations and business owners.","criteria":"Signed owner matrix, launch gates, incident runbooks, backup restore evidence, access review, policy exceptions and go/no-go process.","guide":"Reference: platform on-call owns SLOs, security owns IAM review, product owns quality thresholds, data owner owns retention, change board approves initial production scope."}];

const defaults = () => ({theme:'dark', completed:{}, quizzes:{}, quizDraft:{}, bookmarks:[], expanded:{}, codeTabs:{}, notes:{}, capstone:{}, capDone:{}, finalDraft:{}, finalResult:null, lab:'lifecycle', labSettings:{}, labStep:0, search:'', diagramNode:0});
function normalizeState(raw){
  const s={...defaults(),...(raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{})};
  for(const key of ['completed','quizzes','quizDraft','expanded','codeTabs','notes','capstone','capDone','finalDraft','labSettings']){
    if(!s[key] || typeof s[key]!=='object' || Array.isArray(s[key])) s[key]={};
  }
  if(!Array.isArray(s.bookmarks))s.bookmarks=[];
  s.bookmarks=s.bookmarks.filter(v=>typeof v==='string' && /^\d+:\d+$/.test(v));
  if(typeof s.search!=='string')s.search='';
  if(!['dark','light'].includes(s.theme))s.theme='dark';
  if(!['lifecycle','tools','multi','rag','memory','queue','approval','recovery','telemetry','topology','cost'].includes(s.lab))s.lab='lifecycle';
  if(!Number.isFinite(s.labStep))s.labStep=0;
  if(!Number.isFinite(s.diagramNode))s.diagramNode=0;
  return s;
}

<div class="section-head"><h2 class="h2">Twelve production deliverables</h2><span class="pill">Each saved on this device</span></div>${CAPSTONE.map((c,i)=>{const text=state.capstone[i]||'',complete=Boolean(state.capDone[i]);return `<section class="cap-step"><div class="cap-step-head"><div><div class="overline">GATE ${String(i+1).padStart(2,'0')} / ${esc(c.category)}</div><h3>${esc(c.title)}</h3></div><span class="pill ${complete?'complete':''}">${complete?'✓ Documented':'Not reviewed'}</span></div><p>${esc(c.task)}</p><div class="notice"><strong>Evidence required</strong><p>${esc(c.criteria)}</p></div><label class="overline" for="cap-${i}">Your architecture decision and verification evidence</label><textarea id="cap-${i}" data-cap="${i}" placeholder="Write a concrete decision, interfaces, assumptions, measurable acceptance criteria and failure/recovery plan…">${esc(text)}</textarea><div class="inline-actions" style="margin-top:11px"><span class="evidence" id="cap-length-${i}">${text.trim().length} characters (minimum 80 for a documented gate)</span><button class="btn tiny" data-action="cap-example" data-i="${i}">Show reference guidance</button><button class="btn tiny ${complete?'':'primary'}" data-action="cap-toggle" data-i="${i}">${complete?'Reopen gate':'Mark evidence reviewed'}</button></div><div id="cap-reference-${i}" class="cap-reference hidden">${esc(c.guide)}</div></section>`;}).join('')}
<section class="panel"><h2 class="h3">Architecture handoff readiness</h2><p>${n===12?'All twelve gates contain reviewed notes. Proceed to independent security, operational and business launch review.':'This is a self-attested design checklist. Complete every gate before requesting an independent production readiness audit.'}</p><ul class="check-list"><li>Safety hard blocks: zero unauthorized writes, tenant isolation proven, no unapproved high-impact action</li><li>Recovery proof: replay-safe activities, tested backup/restore and documented RTO/RPO</li><li>Release governance: named owners, SLO alerting, canary stop conditions and rollback authority</li></ul><div class="inline-actions" style="margin-top:14px"><button class="btn primary" data-go="final">Final assessment →</button><button class="btn" data-action="export-progress">Export learning portfolio</button></div></section>`;}

function exportProgress(){const payload={format:'AI Agentic Infrastructure Masterclass progress',version:APP_VERSION,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AI_Masterclass_Learning_Progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('Learning portfolio exported.');}
function importProgress(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);if(!value||value.format!=='AI Agentic Infrastructure Masterclass progress'||typeof value.data!=='object'||Array.isArray(value.data))throw Error('Invalid learning export');if(!confirm('Replace current local learning progress with imported progress?'))return;const data=value.data;state=normalizeState(data);save();document.documentElement.dataset.theme=state.theme;toast('Progress imported successfully.');navigate();}catch(err){toast('Invalid or unreadable learning portfolio.');}};reader.onerror=()=>toast('Unable to read the selected file.');reader.readAsText(file);}

/* Event delegation keeps re-rendered views interactive and keyboard-operable. */
document.addEventListener('click',e=>{
const go=e.target.closest('[data-go]');if(go){e.preventDefault();goto(go.dataset.go);return;}
const b=e.target.closest('[data-action]');if(!b)return;
const act=b.dataset.action,m=Number(b.dataset.m),l=Number(b.dataset.l);
switch(act){
case 'toggle-menu':$('sidebar').classList.toggle('open');$('overlay').classList.toggle('open');break;
case 'toggle-module':state.expanded[m]=!state.expanded[m];save();renderNav();break;
case 'close-menu':$('sidebar').classList.remove('open');$('overlay').classList.remove('open');break;
case 'theme':state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();renderNav();break;
case 'bookmark':{const key=lessonKey(m,l);state.bookmarks=state.bookmarks.includes(key)?state.bookmarks.filter(x=>x!==key):[...state.bookmarks,key];save();renderMain();toast(state.bookmarks.includes(key)?'Lesson bookmarked.':'Bookmark removed.');break;}
case 'complete-lesson':{const key=lessonKey(m,l);if(state.completed[key])delete state.completed[key];else state.completed[key]=true;save();renderNav();renderMain();toast(state.completed[key]?'Lesson completed.':'Lesson reopened.');break;}
case 'code-tab':state.codeTabs[m]=b.dataset.tab;save();renderMain();break;
case 'copy-code':{const source=b.dataset.tab==='config'?COURSE[m].config:COURSE[m].py;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(source).then(()=>toast('Code copied.')).catch(()=>copyFallback(source));}else copyFallback(source);break;}
case 'quiz-answer':{if(state.quizzes[m])break;const d=state.quizDraft[m]||{};d[b.dataset.q]=Number(b.dataset.a);state.quizDraft[m]=d;save();renderMain();break;}
case 'submit-quiz':{const answers=state.quizDraft[m]||{};if(Object.keys(answers).length!==3){toast('Answer all three questions.');break;}const score=COURSE[m].quiz.reduce((sum,q,j)=>sum+(answers[j]===q.answer?1:0),0);state.quizzes[m]={score,at:new Date().toISOString()};save();renderNav();renderMain();toast(`Module assessment: ${score}/3 ${score>=2?'— passed':'— review and retry'}.`);break;}
case 'reset-quiz':delete state.quizzes[m];delete state.quizDraft[m];save();renderNav();renderMain();break;
case 'open-module-lab':state.lab=COURSE[m].simulation;state.labStep=0;save();goto('lab');break;
case 'pick-lab':state.lab=b.dataset.lab;state.labStep=0;save();renderMain();break;
case 'step-forward':state.labStep=Math.min(7,state.labStep+1);save();renderMain();break;
case 'step-reset':state.labStep=0;save();renderMain();break;
case 'cap-example':$(`cap-reference-${b.dataset.i}`)?.classList.toggle('hidden');break;
case 'cap-toggle':{const i=Number(b.dataset.i);if(state.capDone[i])delete state.capDone[i];else if((state.capstone[i]||'').trim().length>=80)state.capDone[i]=true;else{toast('Document at least 80 characters of evidence and acceptance criteria first.');break;}save();renderMain();if($('cap-'+i))$('cap-'+i).focus();toast(state.capDone[i]?'Evidence gate documented.':'Gate reopened.');break;}
case 'final-answer':{if(state.finalResult)break;state.finalDraft[b.dataset.q]=Number(b.dataset.a);save();renderMain();break;}
case 'final-submit':{if(Object.keys(state.finalDraft).length!==20){toast('Answer all 20 questions first.');break;}const score=FINAL_QUESTIONS.reduce((s,q,i)=>s+Number(state.finalDraft[i]===q.answer),0);state.finalResult={score,at:new Date().toISOString()};save();renderMain();window.scrollTo({top:0,behavior:'smooth'});toast(`Final score: ${score}/20 ${score>=16?'— passed':'— retry available'}.`);break;}
case 'final-reset':state.finalDraft={};state.finalResult=null;save();renderMain();break;
case 'export-progress':exportProgress();break;
case 'import-progress':$('importFile').click();break;
case 'reset-progress':if(confirm('Permanently clear all locally stored lessons, quizzes, capstone answers, notes and bookmarks?')){const currentTheme=state.theme;state=defaults();state.theme=currentTheme;save();toast('Local progress reset.');goto('dashboard');navigate();}break;
}

function copyFallback(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-10000px';document.body.appendChild(ta);ta.select();try{const ok=document.execCommand('copy');toast(ok?'Code copied.':'Copy failed: select the visible code manually.');}catch(err){toast('Copy unsupported in this browser. Select the code manually.');}ta.remove();}
document.addEventListener('input',e=>{

l acknowledgement')\n        print('Replay:',p.deliver(action))\n        print('Remote effects:',p.target.execute('SELECT count(*) FROM remote_effects').fetchone()[0])\n        print('Trace:',[(x['event'],x['ts']) for x in p.control.execute('SELECT * FROM spans')])\n        p.close()\nif __name__=='__main__': main()","reflection":"Under what preconditions would the result of test_01 cease to be a valid production claim? Identify a missing control and its owner."},{"title":"Failure engineering","task":"Inject a missing tool, a repeated call, and a budget exhaustion; inspect the deny outcome","walkthrough":"Deliberately inject a failure; record the before/after state and explain whether replay is safe.","deliverable":"Demonstrate the named regression test, attach exact expected-versus-observed evidence.","command":"python -m unittest discover -s tests -v","test":"test_01","expected":"Policy denies the untrusted principal and no effect is emitted","source":"tests/test_reference.py","sample":"\n    def test_01_policy_blocks_untrusted_actor(self):\n        with self.assertRaises(Denied):\n            self.p.submit(Principal('viewer','acme',frozenset()), 'invoice-1', {'amount':25})\n\n    def test_02_transactional_outbox(self):\n        action = self.p.submit(self.writer,'invoice-1',{'amount':25})\n        self.assertEqual(self.p.control.execute('SELECT count(*) FROM outbox WHERE action_id=?',(action,)).fetchone()[0],1)\n\n    def test_03_bounded_input_contract(self):\n        with self.assertRaises(ValueError): self.p.submit(self.writer,'invoice-1',{})\n\n    def test_04_canonical_hash_order(self):\n        self.assertEqual(digest({'a':1,'b':2}),digest({'b':2,'a':1}))","reflection":"Under what preconditions would the result of test_01 cease to be a valid production claim? Identify a missing control and its owner."}],"case":{"situation":"A planning model returns an unrecognized command while the remaining step budget is one.","choices":["Reject the command in a trusted di e_effects (\n            action_id TEXT PRIMARY KEY, tenant TEXT NOT NULL,\n            payload_hash TEXT NOT NULL, receipt TEXT NOT NULL)''')\n\n    def trace(self, trace_id: str, event: str, **attrs):\n        # Never send secrets or unredacted document bodies to telemetry.\n        self.control.execute('INSERT INTO spans VALUES (?,?,?,?)',\n                             (trace_id, event, canonical(attrs), time.time()))\n\n    def resource(self, tenant: str, resource: str, revision: int = 1):\n        self.control.execute('INSERT OR IGNORE INTO resources VALUES (?,?,?)',\n                             (tenant, resource, revision))\n\n    def submit(self, principal: Principal, resource: str, payload: dict) -> str:\n        # Authorization takes place OUTSIDE any model prompt or tool response.\n        if 'writer' not in principal.roles:\n            raise Denied('writer role is required')\n        if not isinstance(payload, dict) or not payload or len(canonical(payload)) > 4000:\n            raise ValueError('validated nonempty, bounded JSON object required')\n        row = self.control.execute('SELECT revision FROM resources WHERE tenant=? AND resource=?',\n                                   (principal.tenant, resource)).fetchone()\n        if row is None:\n            raise Denied('resource not found in principal tenant')\n        action_id = str(uuid4())\n        # isolation_level=None means AUTOCOMMIT; a connection context manager\n        # alone would NOT make these writes atomic. Begin explicitly.\n        self.control.execute('BEGIN IMMEDIATE')\n        try:\n            self.control.execute('INSERT INTO actions VALUES (?,?,?,?,?,?,?,?,?)',\n                 (action_id, principal.tenant, principal.id, resource, row['revision'],\n                  canonical(payload), digest(payload), 'PENDING', time.time()))\n            self.control.execute('INSERT INTO outbox VALUES (?,0)', (action_id,))\n            self.control.execute('COMMIT')\n        except Exception:\ doff\n\nFor each gate record an ADR, repo path, test command, raw observed output and\nreviewer decision. A self-assessed checkbox or uploaded JSON is not independent\ncertification. The offline website checks *structure*, not validity of claims.\n\n1. Requirements: actors, budget, SLI/SLO, error budget, RTO/RPO, ADR.\n2. Architecture: C4 diagrams, trust zones, ownership & network boundaries.\n3. Agents: typed coordinator, durable steps, deadlines and cancellation tests.\n4. Models: version-pinned benchmarks, quality/cost/latency routing.\n5. MCP/tools: scoped client/server, negative authorization, malformed args.\n6. RAG: versioned corpus, hybrid retrieval, ACL, deletion, eval set.\n7. Security: STRIDE/OWASP matrix, payload-binding attack tests, no high-severity fails.\n8. Delivery: reproducible image, provenance/SBOM, IaC, staging rollback record.\n9. Reliability: ambiguous external write, redrive, failure drill and timed recovery.\n10. Telemetry: trace IDs, actual exporter, SLO alerts, on-call runbooks.\n11. Economics: token/input/output/tool/storage/egress/human cost reconciliation.\n12. Operations: signoffs, exception log, ownership, on-call handover.\n\nExit criteria require reviewer verification of each raw artifact and no open\ncritical findings. Never interpret in-browser local progress as production approval.","reflection":"Under what preconditions would the result of test_16 cease to be a valid production claim? Identify a missing control and its owner."},{"title":"Working implementation","task":"Run all 28 tests; build an evidence packet with repo paths and observed stdout","walkthrough":"Execute the relevant reference function and capture its stdout, SQL state, or returned result.","deliverable":"Save a passing local test transcript and explain which layer owns authorization.","command":"python -m unittest discover -s tests -v","test":"test_16","expected":"All local suite tests pass; review does not equate to production certification","source":"agent_pl function validCapEvidence(i,raw){
 if(typeof raw!=='string'||raw.length>14000)return {ok:false,error:'Evidence must be a JSON object under 14,000 characters.'};
 let doc;try{doc=JSON.parse(raw)}catch(e){return {ok:false,error:'Provide valid JSON with the required evidence fields.'}}
 if(!doc||typeof doc!=='object'||Array.isArray(doc))return {ok:false,error:'Provide a JSON object.'};
 const fields=CAP_FIELDS[i],missing=fields.filter(k=>typeof doc[k]!=='string'||doc[k].trim().length<12);
 if(missing.length)return {ok:false,error:'Missing substantive fields: '+missing.join(', ')};
 if(!/^(python|pytest|docker|kubectl|make|terraform|curl|npm|node|git|bash|sh|go)\b/.test(doc.test_command.trim()))return {ok:false,error:'Include a reproducible test_command, not a claim.'};
 if(/^(todo|none|pending|tbd|n\/?a)$/i.test(doc.observed_output.trim()))return {ok:false,error:'Document real observed_output; no placeholders.'};
 return {ok:true,error:'Structurally complete — independently verify the attached artifacts before release.'};

if(act==='cap-toggle'){const i=Number(b.dataset.i);if(state.capDone[i])delete state.capDone[i];else{const status=validCapEvidence(i,state.capstone[i]||'');if(!status.ok){toast(status.error);$('cap-'+i)?.focus();return;}state.capDone[i]=true;}save();renderMain();$('cap-'+i)?.focus();toast(state.capDone[i]?'Structurally documented; requires independent evidence review.':'Gate reopened.');return;}
if(act==='lab-predict'){state.labPredictions??={};state.labPredictions[b.dataset.id]=+b.dataset.a;save();renderMain();document.querySelector(`[data-action="lab-predict"][data-id="${b.dataset.id}"][data-a="${b.dataset.a}"]`)?.focus();return;}
if(act==='pretest-answer'){state.pretest??={};state.pretest[b.dataset.i]=Number(b.dataset.a);save();renderMain();return;}
if(act==='review-answer'){state.reviewHistory??={};const i=+b.dataset.i,ok=+b.dataset.a===+b.dataset.good,prev=state.reviewHistory[i]?.level||0,level=ok?Math.min(prev+1,4):0,interval=[1,1,3,7,14][level];state.reviewHistory[i]={level,nextAt:Date.now()+interval*86400000};save();renderMain();toast(ok?'Correct. Next review in '+interval+' days.':'Review reset; due tomorrow.');return;}
},true);
// Single-choice radio controls: arrow keys move within the same question and select.
document.addEventListener('keydown',function(e){const b=e.target.closest('[role="radio"][data-action="quiz-v2"],[role="radio"][data-action="final-v2"]');if(!b||!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 const group=b.closest('[role="radiogroup"]');if(!group)return;const buttons=[...group.querySelectorAll('[role="radio"]:not([disabled])')],ix=buttons.indexOf(b);if(ix<0)return;
 e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(ix+(e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:1)+buttons.length)%buttons.length;buttons[next].click();});
// Tablist arrows, Home/End support with roving tabindex and automatic selection.
document.addEventListener('keydown',function(e){const b=e.target.closest('[data-action="code-v2"]');if(!b)return;const ids=['example','policy'],i=ids.indexOf(b.dataset.tab);let dest=null;if(e.key==='ArrowRight')dest=(i+1)%2;else if(e.key==='ArrowLeft')dest=(i+1)%2;else if(e.key==='Home')dest=0;else if(e.key==='End')dest=1;if(dest===null)return;e.preventDefault();state.codeTabs[b.dataset.m+':'+b.dataset.l]=ids[dest];save();renderMain();document.getElementById(`tab-${b.dataset.m}-${b.dataset.l}-${ids[dest]}`)?.focus();});
// Harden imported learning data: do not trust exported scores or unbounded nested objects.
function safeState(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid state root');if(JSON.stringify(raw).length>160000)throw Error('Portfolio exceeds 160KB.');const result=defaults(),allowed=['theme','completed','quizzes','quizDraft','bookmarks','expanded','codeTabs','notes','capstone','capDone','finalDraft','finalResult','lab','labSettings','labStep','search','diagramNode','challengeAnswers','pretest','reviewHistory','labPredictions','labNotes'];
 for(const name of Object.keys(raw))if(!allowed.includes(name))throw Error('Unknown state property: '+name);
 result.theme=raw.theme==='light'?'light':'dark';result.lab=LAB_MAP[raw.lab]?raw.lab:'lifecycle';result.search=typeof raw.search==='string'?raw.search.slice(0,120):'';
 result.bookmarks=Array.isArray(raw.bookmarks)?raw.bookmarks.filter(k=>typeof k==='string'&&validLessonKey(k)).slice(0,48):[];
 for(const name of ['completed','notes','challengeAnswers']){const src=raw[name]||{};if(typeof src!=='object'||Array.isArray(src)||Object.keys(src).length>100)throw Error('Malformed '+name);result[name]={};for(const [k,v] of Object.entries(src))if(validLessonKey(k)){if(name==='notes')result[name][k]=String(v).slice(0,6000);else if(name==='completed')result[name][k]=v===true;else if(Number.isInteger(v)&&v>=0&&v<=3)result[name][k]=v;}}
 for(const name of ['quizDraft','quizzes','capstone','capDone','codeTabs','expanded','reviewHistory','pretest']){const src=raw[name]||{};if(typeof src!=='object'||Array.isArray(src)||Object.keys(src).length>80)throw Error('Malformed '+name);result[name]={};for(const [k,v] of Object.entries(src)){
  const i=+k;if(!Number.isInteger(i)||i<0||i>=16){if(name==='codeTabs'&&/^\d+:\d+$/.test(k)&&['example','policy'].includes(v))result[name][k]=v;continue;}
  if(name==='quizDraft'){if(v&&typeof v==='object'&&!Array.isArray(v))result[name][k]=Object.fromEntries(Object.entries(v).filter(([j,a])=>+j>=0&&+j<5&&Number.isInteger(a)&&a>=0&&a<4));}
  if(name==='quizzes'){if(v&&Number.isInteger(v.score)&&Number.isInteger(v.total)&&v.total===5&&v.score>=0&&v.score<=5)result[name][k]={score:v.score,total:5,at:String(v.at||'').slice(0,40)};}
  if(name==='capstone')result[name][k]=typeof v==='string'?v.slice(0,14000):'';
  if(name==='capDone')result[name][k]=v===true;
  if(name==='expanded')result[name][k]=v===true;
  if(name==='reviewHistory'){if(v&&Number.isInteger(v.level)&&v.level>=0&&v.level<=4&&Number.isFinite(v.nextAt))result[name][k]={level:v.level,nextAt:Math.max(0,Math.min(v.nextAt,Date.now()+366*86400000))};}
  if(name==='pretest'&&Number.isInteger(v)&&v>=0&&v<=3)result[name][k]=v;
 }}
 result.labPredictions={};if(raw.labPredictions&&typeof raw.labPredictions==='object'&&!Array.isArray(raw.labPredictions))for(const [k,v] of Object.entries(raw.labPredictions))if(LAB_MAP[k]&&Number.isInteger(v)&&v>=0&&v<=2)result.labPredictions[k]=v;
 result.labNotes={};if(raw.labNotes&&typeof raw.labNotes==='object'&&!Array.isArray(raw.labNotes))for(const [k,v] of Object.entries(raw.labNotes))if(LAB_MAP[k]&&typeof v==='string')result.labNotes[k]=v.slice(0,3000);
 result.finalDraft={};if(raw.finalDraft&&typeof raw.finalDraft==='object'&&!Array.isArray(raw.finalDraft)&&Object.keys(raw.finalDraft).length<=FINAL_V2.length){for(const [k,v] of Object.entries(raw.finalDraft))if(+k>=0&&+k<FINAL_V2.length&&Number.isInteger(v)&&v>=0&&v<=3)result.finalDraft[k]=v;}
 if(raw.finalResult?.total===FINAL_V2.length&&Number.isInteger(raw.finalResult.score)&&raw.finalResult.score>=0&&raw.finalResult.score<=FINAL_V2.length)result.finalResult={score:raw.finalResult.score,total:FINAL_V2.length,at:String(raw.finalResult.at||'').slice(0,40)};
 result.labSettings=raw.labSettings&&typeof raw.labSettings==='object'&&!Array.isArray(raw.labSettings)?Object.fromEntries(Object.entries(raw.labSettings).slice(0,40).filter(([k,v])=>k.length<50&&(typeof v==='string'&&v.length<100||typeof v==='number'&&Number.isFinite(v)))):{};
 result.labStep=Number.isInteger(raw.labStep)?Math.max(0,Math.min(raw.labStep,7)):0;
 result.diagramNode=Number.isInteger(raw.diagramNode)?Math.max(0,Math.min(raw.diagramNode,20)):0;
 for(const [key,value] of Object.entries(result.completed))if(value && result.challengeAnswers?.[key]!==MASTERY[+key.split(':')[0]].case.answer)delete result.completed[key];
 for(let i=0;i<12;i++)if(result.capDone[i]&&!validCapEvidence(i,result.capstone[i]||'').ok)delete result.capDone[i];
 return result;
}
importProgress=function(file){if(!file)return;if(file.size>160000){toast('Rejected: import exceeds 160KB.');return;}const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(String(reader.result));if(value.format!=='AI Agentic Infrastructure Masterclass progress')throw Error('Wrong file format');const imported=safeState(value.data);if(!confirm(`Import a validated learning portfolio from ${esc(String(value.exportedAt||'unknown date'))}? This replaces local progress and is not a credential.`))return;state=imported;save();document.documentElement.dataset.theme=state.theme;toast('Validated local portfolio imported.');navigate();}catch(err){toast('Import rejected: '+String(err.message).slice(0,100));}};reader.readAsText(file);};
// Live capstone JSON schema validation status, without extra page re-renders.
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.labNote!==undefined){state.labNotes??={};state.labNotes[t.dataset.labNote]=t.value.slice(0,3000);save();return;}if(t.dataset.cap===undefined)return;const i=+t.dataset.cap,el=$('cap-length-'+i);if(el)el.textContent=validCapEvidence(i,t.value).error;if(state.capDone[i]&&!validCapEvidence(i,t.value).ok){delete state.capDone[i];save();}},true);
// Validate legacy state after course schema migration; discard tampered fields.
try {state=safeState(state);}catch(err){state=defaults();}save();
// Navigation landmarks: restore a stable heading target after route changes.
const originalNavigate3=navigate;
navigate=function(){const keepSearch=document.activeElement?.id==='globalSearch';originalNavigate3();if(keepSearch){$('globalSearch')?.focus();return;}const first=$('main')?.querySelector('h1');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}}

document.documentElement.dataset.theme=state.theme;
$('globalSearch').value=state.search||'';
route=readHash();navigate();

// Lesson wayfinding uses element IDs, not URL hashes, so it never triggers the course router.
document.addEventListener('click', event=>{
 const control=event.target.closest('[data-jump]');if(!control)return;
 const allowed=new Set(['overview','architecture-section','implementation-section','evidence-section']);
 const target=control.dataset.jump;if(!allowed.has(target))return;
 document.getElementById(target)?.scrollIntoView({behavior:'instant',block:'start'});
});
</script>
